<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%230ea5e9'/%3E%3Cstop offset='.55' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23f97316'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='36' font-family='Georgia,serif' font-weight='700' fill='white'%3E%26%233321%3B%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>數學學習模擬器 Pro · F1–F3</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --text:#1e293b; --muted:#7b8798; --line:#e8ecf4;
  --f1:#0ea5e9; --f2:#8b5cf6; --f3:#f97316;
  --ok:#16a34a; --bad:#dc2626; --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 8%,rgba(14,165,233,.09),transparent 42%),
                   radial-gradient(circle at 88% 4%,rgba(139,92,246,.09),transparent 42%),
                   radial-gradient(circle at 50% 100%,rgba(249,115,22,.07),transparent 45%);
  background-attachment:fixed;
}
button,input,textarea,select{font-family:inherit}
/* ---------- 頂欄 ---------- */
.topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(244,246,251,.86);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#0ea5e9,#8b5cf6 60%,#f97316);color:#fff;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -10px rgba(99,102,241,.7)}
.brand h1{font-size:16px;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand p{font-size:11px;color:var(--muted)}
.nav{display:flex;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  border:0;background:transparent;padding:8px 14px;border-radius:11px;font-size:13.5px;font-weight:700;
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:.22s
}
.nav button:hover{background:#fff;color:var(--text)}
.nav button.active{background:#1e293b;color:#fff;box-shadow:0 8px 18px -10px rgba(15,23,42,.8)}
.top-right{display:flex;align-items:center;gap:8px;flex:none}
.lang-switch{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px}
.lang-switch button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;transition:.2s}
.lang-switch button.active{background:#1e293b;color:#fff}
.user-chip{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.user-chip:hover{border-color:#c7d2e3;transform:translateY(-1px)}
.avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* ---------- 版面 ---------- */
.view{display:none;max-width:1240px;margin:0 auto;padding:20px 20px 80px}
.view.active{display:block;animation:fadeUp .4s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:22px 0 30px}
.hero h2{font-size:29px;font-weight:800;letter-spacing:-.5px}
.hero p{color:var(--muted);font-size:14px;margin-top:7px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(266px,1fr));gap:22px}
/* ---------- 年級卡 ---------- */
.gcard{position:relative;background:var(--card);border-radius:24px;padding:30px 24px 26px;border:2px solid var(--line);cursor:pointer;overflow:hidden;transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s,border-color .4s}
.gcard::before{content:'';position:absolute;inset:0;border-radius:24px;pointer-events:none;background:radial-gradient(circle at 50% -10%,var(--as),transparent 68%);opacity:0;transition:opacity .4s}
.gcard[data-g="f1"]{--ac:var(--f1);--as:rgba(14,165,233,.15);--ash:rgba(14,165,233,.42)}
.gcard[data-g="f2"]{--ac:var(--f2);--as:rgba(139,92,246,.15);--ash:rgba(139,92,246,.42)}
.gcard[data-g="f3"]{--ac:var(--f3);--as:rgba(249,115,22,.15);--ash:rgba(249,115,22,.42)}
.gcard:hover,.gcard:focus-visible{transform:scale(1.05) translateY(-9px);border-color:var(--ac);box-shadow:0 28px 50px -24px var(--ash),0 0 0 7px var(--as);outline:none}
.gcard:hover::before{opacity:1}
.gcard:hover .gico{transform:scale(1.15) rotate(-6deg)}
.gcard:hover .garrow{transform:translateX(6px);opacity:1}
.gico{width:58px;height:58px;border-radius:18px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#fff));box-shadow:0 14px 26px -13px var(--ash);transition:transform .4s}
.gtitle{font-size:22px;font-weight:800}
.gdesc{font-size:13px;color:var(--muted);margin-top:6px;min-height:40px}
.gtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gtags span{font-size:11px;padding:3px 9px;border-radius:7px;background:var(--as);color:var(--ac);font-weight:700}
.garrow{position:absolute;right:24px;bottom:24px;font-size:21px;color:var(--ac);opacity:.45;transition:.4s}
/* ---------- 通用卡片 ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.panel h3{font-size:16px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.btn{border:0;border-radius:12px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;transition:.22s}
.btn.primary{background:#1e293b;color:#fff}
.btn.primary:hover:not(:disabled){background:#0f172a;transform:translateY(-2px);box-shadow:0 14px 26px -16px rgba(15,23,42,.9)}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#f1f4fa;color:#475569}
.btn.ghost:hover{background:#e6ebf5}
.btn.sm{padding:7px 14px;font-size:12.5px;border-radius:10px}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.danger:hover{background:#fecaca}
/* ---------- 學習 ---------- */
.learn-grid{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 13px;position:sticky;top:80px}
.side h4{font-size:13px;font-weight:800;color:var(--muted);padding:0 8px 9px;letter-spacing:.5px}
.gswitch{display:flex;gap:5px;padding:0 4px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.gswitch button{flex:1;border:0;background:#f4f6fb;color:var(--muted);padding:7px 0;border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;transition:.2s}
.gswitch button.active{background:#1e293b;color:#fff}
.tlist{list-style:none;display:flex;flex-direction:column;gap:3px}
.titem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:700;color:#475569;transition:.2s;border-left:3px solid transparent}
.titem:hover{background:#f6f8fc;color:var(--text);transform:translateX(2px)}
.titem.active{background:#eef4ff;color:#1d4ed8;border-left-color:#3b82f6}
.titem .ti{width:26px;height:26px;border-radius:8px;flex:none;background:#eef2f9;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800}
.titem.active .ti{background:#dbeafe}
.content{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px 30px;min-height:400px}
.content .chead{display:flex;align-items:center;gap:13px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.content .cico{width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;background:#eef4ff;color:#1d4ed8}
.content h2{font-size:21px;font-weight:800}
.content h3{font-size:15.5px;font-weight:800;margin:20px 0 8px;color:#0f172a;padding-left:11px;border-left:4px solid #3b82f6;line-height:1.3}
.content h4{font-size:14px;font-weight:800;margin:14px 0 6px;color:#334155}
.content p,.content li{font-size:14px;color:#334155;margin-bottom:6px}
.content ul,.content ol{padding-left:21px;margin:7px 0}
.content b{color:#0f172a}
.example{background:#f7f9fd;border-left:4px solid #3b82f6;border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0;font-size:13.5px;color:#1e293b}
.example b{color:#1d4ed8}
.warn{background:#fff5f5;border-left:4px solid #ef4444;border-radius:0 12px 12px 0;padding:12px 16px;margin:12px 0;font-size:13.5px;color:#7f1d1d}
.tip{background:linear-gradient(135deg,#fff8ed,#fffdf9);border:1px solid #fce9cf;border-radius:12px;padding:12px 16px;margin-top:14px;font-size:13px;color:#8a5a12}
.formula{background:#0f172a;color:#e2e8f0;border-radius:12px;padding:13px 18px;margin:11px 0;font-size:14.5px;font-weight:600;letter-spacing:.3px;overflow-x:auto}
/* ---------- 專題練習 ---------- */
.exam-setup{display:grid;gap:16px}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;padding:9px 18px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.22s}
.opt:hover{transform:translateY(-2px);box-shadow:0 10px 20px -15px rgba(30,41,59,.6)}
.opt.active{background:#1e293b;border-color:#1e293b;color:#fff}
.topic-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.tpc{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;cursor:pointer;transition:.22s;text-align:left}
.tpc:hover{border-color:#b9c6dc;transform:translateY(-2px)}
.tpc.active{border-color:#3b82f6;background:#eef4ff;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.tpc b{display:block;font-size:13px;font-weight:800}
.tpc span{font-size:11px;color:var(--muted)}
/* 答題 */
.qbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.progress{height:7px;background:#e8ecf4;border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,#8b5cf6);border-radius:99px;transition:width .35s}
.qtext{font-size:19px;font-weight:700;line-height:1.55;padding:20px 22px;background:#f7f9fd;border-radius:15px;margin-bottom:18px;min-height:60px}
.ansrow{display:flex;gap:10px}
.ansrow input{flex:1;border:2px solid var(--line);border-radius:12px;padding:12px 15px;font-size:16px;font-weight:700;outline:none;transition:.2s;background:#fff;color:var(--text)}
.ansrow input:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.12)}
.feedback{margin-top:14px;font-size:15px;font-weight:800;min-height:24px}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.explain{margin-top:14px;background:#f7f9fd;border-left:4px solid #3b82f6;border-radius:0 12px 12px 0;padding:14px 18px;font-size:13.5px;display:none}
.explain.show{display:block;animation:fadeUp .3s}
.explain h5{font-size:13px;font-weight:800;color:#1d4ed8;margin-bottom:7px}
.explain ol{padding-left:19px}
.explain li{margin-bottom:5px}
.result-big{text-align:center;padding:14px 0 22px}
.result-big .num{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.result-big .lbl{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.result-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:11px;margin:18px 0}
.rstat{background:#f7f9fd;border-radius:13px;padding:13px;text-align:center}
.rstat b{display:block;font-size:20px;font-weight:800}
.rstat span{font-size:11.5px;color:var(--muted);font-weight:700}
/* ---------- 坐標系 ---------- */
.graph-wrap{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.canvas-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:relative}
#graphCanvas{display:block;width:100%;height:520px;touch-action:none;cursor:crosshair}
.gtools{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.gtools button{border:1px solid var(--line);background:rgba(255,255,255,.94);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;color:#475569}
.gtools button:hover{background:#fff;border-color:#b9c6dc}
.gtools button.active{background:#1e293b;color:#fff;border-color:#1e293b}
.gpanel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.gpanel h4{font-size:13px;font-weight:800;margin-bottom:10px;color:#334155}
.glist{list-style:none;font-size:12.5px;max-height:220px;overflow-y:auto;margin-bottom:12px}
.glist li{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:8px;background:#f7f9fd;margin-bottom:5px;font-weight:600}
.glist li span{color:var(--muted);font-weight:600}
.glist li button{border:0;background:transparent;color:#dc2626;font-weight:800;cursor:pointer;font-size:12px}
.ghint{font-size:11.5px;color:var(--muted);line-height:1.6;background:#f7f9fd;border-radius:10px;padding:9px 11px}
/* ---------- AI ---------- */
.ai-wrap{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.chat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;height:560px;overflow:hidden}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 15px;border-radius:14px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.bot{background:#f1f4fa;color:#1e293b;border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:#1e293b;color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.msg.bot b{color:#1d4ed8}
.chat-in{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);background:#fbfcfe}
.chat-in textarea{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13.5px;resize:none;height:44px;outline:none;transition:.2s}
.chat-in textarea:focus{border-color:#3b82f6}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 12px}
.quick button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:700;color:#475569;cursor:pointer;transition:.2s}
.quick button:hover{background:#eef4ff;border-color:#bfdbfe;color:#1d4ed8}
.upload-box{border:2px dashed #cfd9e8;border-radius:13px;padding:16px;text-align:center;cursor:pointer;transition:.2s;margin-bottom:12px}
.upload-box:hover{border-color:#3b82f6;background:#f7fbff}
.upload-box input{display:none}
.upload-box p{font-size:12.5px;color:var(--muted);font-weight:700}
.upload-box .ic{font-size:26px;margin-bottom:5px}
#preview{max-width:100%;border-radius:10px;margin-top:9px;display:none}
/* ---------- 我的 ---------- */
.tabs{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:#fff;padding:9px 20px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s}
.tabs button.active{background:#1e293b;border-color:#1e293b;color:#fff}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 17px;margin-bottom:11px;transition:.2s}
.item:hover{border-color:#cfd9e8;box-shadow:0 8px 22px -18px rgba(30,41,59,.6)}
.item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.item-head b{font-size:14px}
.item-head .meta{font-size:11.5px;color:var(--muted);font-weight:700}
.badge{display:inline-block;font-size:10.5px;padding:2px 9px;border-radius:7px;font-weight:800;margin-left:6px}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.bad{background:#fee2e2;color:#b91c1c}
.badge.mid{background:#fef3c7;color:#a16207}
.detail{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.detail.show{display:block;animation:fadeUp .28s}
.dq{font-size:13px;font-weight:700;margin-bottom:5px}
.dmeta{font-size:12px;margin-bottom:5px;color:var(--muted)}
.dex{font-size:12.5px;background:#f7f9fd;border-radius:9px;padding:9px 12px;color:#334155}
.empty{text-align:center;padding:44px 20px;color:var(--muted);font-size:13.5px}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.5}
.note-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
.note-item h5{font-size:13.5px;font-weight:800;margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.note-item p{font-size:13px;color:#475569;white-space:pre-wrap}
.note-item .tag{font-size:10.5px;background:#eef4ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-weight:800}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.5px;outline:none;transition:.2s;background:#fff;color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.field textarea{resize:vertical;min-height:90px}
/* 登入 */
.auth-card{max-width:400px;margin:36px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px 30px;box-shadow:0 30px 60px -40px rgba(30,41,59,.5)}
.auth-card h2{font-size:21px;font-weight:800;text-align:center;margin-bottom:6px}
.auth-card>p{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:20px}
.auth-tabs{display:flex;background:#f1f4fa;border-radius:11px;padding:3px;margin-bottom:18px}
.auth-tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-size:13px;font-weight:800;color:var(--muted);cursor:pointer;transition:.2s}
.auth-tabs button.active{background:#fff;color:var(--text);box-shadow:0 3px 9px -4px rgba(30,41,59,.25)}
.auth-msg{font-size:12.5px;font-weight:700;text-align:center;min-height:20px;margin-top:9px}
.auth-msg.err{color:var(--bad)}.auth-msg.ok{color:var(--ok)}
/* 響應式 */
@media(max-width:900px){
  .learn-grid,.graph-wrap,.ai-wrap{grid-template-columns:1fr}
  .side{position:static}
  .tlist{flex-direction:row;overflow-x:auto;padding-bottom:5px}
  .titem{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .titem.active{border-left:0;border-bottom-color:#3b82f6}
  .content{padding:22px 18px}
}
@media(max-width:600px){
  .topbar-in{padding:10px 14px;gap:10px}
  .brand h1{font-size:14px}.brand p{display:none}
  .view{padding:14px 14px 70px}
  .hero h2{font-size:23px}
  .content{padding:18px 15px}
  .qtext{font-size:16.5px;padding:16px}
  .ansrow{flex-direction:column}
  .ansrow .btn{width:100%}
  #graphCanvas{height:400px}
  .chat{height:480px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <div class="logo">∑</div>
      <div><h1 data-i="appTitle"></h1><p data-i="appSub"></p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="top-right">

zh:`<h3>一、甚麼是有向數？</h3>
<p>「有向數」就是帶有正負號的數，用來表示<b>相反方向的量</b>。例如温度 +8 °C 與 −3 °C、銀行存款 +500 元與欠款 −500 元。正數前可省略「+」號，負數必須寫上「−」號。</p>
<h3>二、數線與大小比較</h3>
<p>在數線上，<b>右邊的數永遠大於左邊的數</b>。因此任何負數都小於 0，也小於任何正數；而兩個負數比較時，<b>絕對值較大的反而較小</b>。</p>
<div class="example"><b>例：</b>比較 −7 與 −3。<br>|−7| = 7，|−3| = 3。因為 7 &gt; 3，所以 <b>−7 &lt; −3</b>。</div>
<h3>三、加法法則</h3>
<ul>
<li><b>同號相加</b>：取相同的符號，把絕對值相加。<br>例：(−4) + (−6) = −(4+6) = −10</li>
<li><b>異號相加</b>：取<b>絕對值較大者</b>的符號，再把絕對值相減。<br>例：(−9) + 4 = −(9−4) = −5；(−3) + 8 = +(8−3) = +5</li>
<li><b>互為相反數相加</b>：a + (−a) = 0</li>
</ul>
<h3>四、減法法則</h3>
<p>減去一個數，等於<b>加上它的相反數</b>：</p>
<div class="formula">a − b = a + (−b)</div>
<div class="example"><b>例：</b>5 − (−3) = 5 + 3 = 8；(−2) − 6 = (−2) + (−6) = −8</div>
<h3>五、乘法與除法法則</h3>
<ul>
<li><b>同號得正</b>：(+3) × (+4) = +12；(−3) × (−4) = +12</li>
<li><b>異號得負</b>：(+3) × (−4) = −12；(−12) ÷ (+3) = −4</li>
<li><b>任何數乘 0 都是 0</b></li>
</ul>

<li><b>化係數為 1</b>：兩邊同除以 x 的係數</li>
</ol>
<div class="example"><b>例 1：</b>解 5x − 7 = 18<br>5x = 18 + 7 = 25<br>x = 25 ÷ 5 = <b>5</b></div>
<div class="example"><b>例 2（含括號）：</b>解 3(x − 2) = 2x + 5<br>3x − 6 = 2x + 5<br>3x − 2x = 5 + 6<br><b>x = 11</b></div>
<div class="example"><b>例 3（兩邊都有 x）：</b>解 4x + 3 = 6x − 9<br>3 + 9 = 6x − 4x<br>12 = 2x → <b>x = 6</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：移項忘記變號；去括號時漏乘負號（例如 −2(x − 3) = −2x + 6，不是 −2x − 6）。</div>
<h3>五、驗算</h3>
<p>把求得的解代回原方程，若左右兩邊相等，則答案正確。這是<b>必做</b>的步驟。</p>
<div class="tip">🇲🇴 <b>澳門情境</b>：一盒杏仁餅 x 元，買 3 盒加 5 元運費，共付 110 元 → 3x + 5 = 110 → 3x = 105 → x = 35 元。</div>`,
en:`<h3>1. Algebraic expressions</h3>
<p>Use letters for unknowns: 3x + 2 means "3 times x plus 2". Conventions: 1x → x, x × y → xy, x ÷ 4 → x/4.</p>
<h3>2. Substitution</h3>
<div class="example">If x = 4, 2x² − 5x + 1 = 2(16) − 5(4) + 1 = 13</div>
<div class="warn">⚠️ Always bracket negatives: if x = −2, write (−2)² = 4, not −2².</div>
<h3>3. Like terms</h3>
<div class="example">4x + 3y − 2x + 5y = 2x + 8y</div>
<h3>4. Linear equations in one unknown</h3>
<ol>
<li>Remove brackets</li>
<li>Move terms (change sign when crossing the equals sign)</li>
<li>Divide both sides by the coefficient of x</li>
</ol>
<div class="example">5x − 7 = 18 → 5x = 25 → <b>x = 5</b></div>
<div class="example">3(x − 2) = 2x + 5 → 3x − 6 = 2x + 5 → <b>x = 11</b></div>
<div class="example">4x + 3 = 6x − 9 → 12 = 2x → <b>x = 6</b></div>
<div class="warn">⚠️ Common errors: forgetting to change signs when moving terms; missing the negative sign when expanding −2(x − 3) = −2x + 6.</div>
<h3>5. Checking</h3>
<p>Substitute your answer back into the original equation — always verify.</p>
<div class="tip">🇲🇴 Macau: 3 boxes of almond cakes at $x plus $5 delivery = $110 → x = $35.</div>`},

'f1-3':{
zh:`<h3>一、百分數的意義</h3>
<p>「百分數」是把一個數寫成「分母是 100 的分數」，符號為 %。</p>
<div class="formula">p% = p ÷ 100 = p/100</div>
<p>例如 25% = 25/100 = 0.25；0.7 = 70%；3/5 = 60%。</p>
<h3>二、三種基本題型</h3>
<h4>① 求某數的 p%</h4>
<div class="formula">所求 = 該數 × p%</div>
<div class="example"><b>例：</b>求 240 的 35%。<br>240 × 35% = 240 × 0.35 = <b>84</b></div>
<h4>② 求「某數是另一個數的百分之幾」</h4>
<div class="formula">百分數 = 部分 ÷ 全部 × 100%</div>
<div class="example"><b>例：</b>一班 40 人中有 26 人及格，及格率是多少？<br>26 ÷ 40 × 100% = <b>65%</b></div>
<h4>③ 已知部分及百分數，求全部</h4>
<div class="formula">全部 = 部分 ÷ 百分數</div>
<div class="example"><b>例：</b>某校 15% 的學生戴眼鏡，共 96 人，全校有多少人？<br>96 ÷ 0.15 = <b>640 人</b></div>
<h3>三、百分變化</h3>
<div class="formula">百分變化 = (新值 − 舊值) ÷ 舊值 × 100%</div>
<p>結果為正表示<b>增加</b>，為負表示<b>減少</b>。</p>
<div class="example"><b>例：</b>某商品由 400 元加價到 460 元，求百分增加。<br>(460 − 400) ÷ 400 × 100% = 60 ÷ 400 × 100% = <b>15%</b></div>
<h3>四、折扣與售價</h3>
<div class="formula">售價 = 原價 × 折扣率</div>
<p>「八折」= 原價的 80%；「七五折」= 原價的 75%。</p>
<div class="example"><b>例：</b>原價 480 元的衣服打七折 → 480 × 0.7 = <b>336 元</b></div>
<h3>五、增加／減少的連續變化</h3>
<p>先加價 p% 再減價 p%，<b>不會回到原價</b>，因為兩次的基數不同。</p>
<div class="example"><b>例：</b>100 元先加價 20% 得 120 元，再減價 20% 得 120 × 0.8 = 96 元，比原價少 4 元。</div>
<div class="warn">⚠️ <b>常見錯誤</b>：把「增加了 20%」誤解為「增加到 20%」。增加 20% 後是原來的 120%。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：格蘭披治大賽車門票早鳥 85 折，原價 400 元 → 售價 400 × 0.85 = 340 元，省下 60 元。</div>`,
en:`<h3>1. Meaning</h3>
<div class="formula">p% = p ÷ 100</div>
<p>25% = 0.25, 0.7 = 70%, 3/5 = 60%.</p>
<h3>2. Three basic types</h3>
<h4>① p% of a number</h4>
<div class="example">35% of 240 = 240 × 0.35 = <b>84</b></div>
<h4>② What percentage is A of B?</h4>
<div class="example">26 out of 40 = 26 ÷ 40 × 100% = <b>65%</b></div>
<h4>③ Finding the whole</h4>
<div class="example">15% of students = 96 → total = 96 ÷ 0.15 = <b>640</b></div>
<h3>3. Percentage change</h3>
<div class="formula">Change = (new − old) ÷ old × 100%</div>
<div class="example">From $400 to $460: 60 ÷ 400 × 100% = <b>15% increase</b></div>
<h3>4. Discount</h3>
<div class="formula">Selling price = marked price × discount rate</div>
<div class="example">$480 at 30% off → 480 × 0.7 = <b>$336</b></div>
<h3>5. Successive changes</h3>
<p>+20% then −20% does <b>not</b> return to the original: 100 → 120 → 96.</p>
<div class="warn">⚠️ "Increased by 20%" ≠ "increased to 20%".</div>
<div class="tip">🇲🇴 Macau: Grand Prix tickets at 85% of $400 = $340.</div>`},

'f1-4':{
zh:`<h3>一、比的意義</h3>
<p>比 a : b 表示兩個量的<b>相對大小</b>關係。a 叫前項，b 叫後項（b ≠ 0）。</p>
<p><b>化簡比</b>：把前後項同除以它們的最大公因數，使兩項互質。</p>
<div class="example"><b>例：</b>化簡 24 : 36 → 同除以 12 → <b>2 : 3</b></div>
<h3>二、比例與交叉相乘</h3>
<p>若 a : b = c : d，則：</p>
<div class="formula">a × d = b × c（外項積 = 內項積）</div>
<div class="example"><b>例：</b>解 3 : 4 = x : 20<br>4x = 3 × 20 = 60 → <b>x = 15</b></div>
<h3>三、按比例分配</h3>
<p>把總量按 a : b : c 分配，先求<b>總份數</b>，再求每份的量。</p>
<div class="example"><b>例：</b>把 480 元按 3 : 5 分給甲、乙。<br>總份數 = 3 + 5 = 8<br>每份 = 480 ÷ 8 = 60 元<br>甲 = 3 × 60 = <b>180 元</b>，乙 = 5 × 60 = <b>300 元</b></div>
<h3>四、率</h3>
<p>「率」是帶單位的比，表示兩個不同單位的量之間的關係。</p>
<div class="formula">速度 = 距離 ÷ 時間　　密度 = 質量 ÷ 體積　　單價 = 總價 ÷ 數量</div>
<div class="example"><b>例：</b>汽車 2.5 小時行 180 km，平均速度 = 180 ÷ 2.5 = <b>72 km/h</b></div>
<h3>五、連比</h3>
<p>已知 a : b 和 b : c，可求 a : b : c。方法：把 b 的份數化為相同。</p>
<div class="example"><b>例：</b>a : b = 2 : 3，b : c = 4 : 5。把 b 化成 12 → a : b = 8 : 12，b : c = 12 : 15，所以 <b>a : b : c = 8 : 12 : 15</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：化簡比時只除一邊；單位不同時直接比較（例如 30 cm : 1 m 要先化成 30 : 100 = 3 : 10）。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：關閘到氹仔約 12 km，巴士行 30 分鐘（0.5 小時），平均速度 = 12 ÷ 0.5 = 24 km/h。</div>`,
en:`<h3>1. Ratio</h3>
<p>a : b compares two quantities. Simplify by dividing both terms by their HCF.</p>
<div class="example">24 : 36 = <b>2 : 3</b></div>
<h3>2. Proportion</h3>
<div class="formula">If a : b = c : d then ad = bc</div>
<div class="example">3 : 4 = x : 20 → 4x = 60 → <b>x = 15</b></div>
<h3>3. Sharing in a ratio</h3>
<div class="example">$480 in the ratio 3 : 5 → 8 parts, each $60 → <b>$180 and $300</b></div>
<h3>4. Rate</h3>
<div class="formula">speed = distance ÷ time; density = mass ÷ volume; unit price = cost ÷ quantity</div>
<div class="example">180 km in 2.5 h → <b>72 km/h</b></div>
<h3>5. Continued ratio</h3>
<div class="example">a : b = 2 : 3, b : c = 4 : 5 → a : b : c = <b>8 : 12 : 15</b></div>
<div class="warn">⚠️ Convert to the same unit first: 30 cm : 1 m = 3 : 10.</div>
<div class="tip">🇲🇴 Macau: Border Gate to Taipa ≈ 12 km in 0.5 h → 24 km/h.</div>`},

'f1-5':{
zh:`<h3>一、四捨五入</h3>
<p>要保留某一位時，看它的<b>下一位數</b>：</p>
<ul>
<li>下一位 ≥ 5 → <b>進一</b></li>
<li>下一位 &lt; 5 → <b>捨去</b></li>
</ul>
<div class="example"><b>例：</b>把 3.847 四捨五入至小數後兩位。<br>看第三位小數 7 ≥ 5，所以進一 → <b>3.85</b></div>
<h3>二、有效數字</h3>
<p>由<b>第一個非零數字</b>開始數，數到最後一位（包括中間和末尾的 0）。</p>
<div class="example">
<b>例：</b>0.004560 的有效數字<br>
由 4 開始數：4、5、6、0 → <b>4 個有效數字</b>（最後的 0 是有效數字）<br>
而 0.00456 只有 3 個有效數字。
</div>
<h3>三、科學記數法</h3>
<div class="formula">a × 10ⁿ，其中 1 ≤ a &lt; 10，n 為整數</div>
<div class="example"><b>例：</b>45 600 000 = 4.56 × 10⁷；0.00032 = 3.2 × 10⁻⁴</div>
<h3>四、估算</h3>
<p>先把各數取<b>一位或兩位有效數字</b>的近似值，再計算，用來快速檢查答案是否合理。</p>
<div class="example"><b>例：</b>估算 498 × 21<br>≈ 500 × 20 = <b>10 000</b>（實際答案 10 458，數量級吻合）</div>
<div class="example"><b>例：</b>估算 587 ÷ 19<br>≈ 600 ÷ 20 = <b>30</b>（實際 ≈ 30.9）</div>
<h3>五、絕對誤差與相對誤差</h3>
<div class="formula">絕對誤差 = |近似值 − 真值|　　相對誤差 = 絕對誤差 ÷ 真值 × 100%</div>
<div class="warn">⚠️ <b>常見錯誤</b>：把 0.0305 有效數字數成 5 個。前面兩個 0 不算，由 3 開始數，共 <b>3 個</b>有效數字。</div>
<div class="tip">🇲🇴 <b>應用</b>：裝修報價、購物找續時，先估算可以避免嚴重錯誤。</div>`,
en:`<h3>1. Rounding off</h3>
<p>Look at the next digit: ≥ 5 round up, &lt; 5 round down.</p>
<div class="example">3.847 to 2 d.p. → <b>3.85</b></div>
<h3>2. Significant figures</h3>
<p>Count from the first non-zero digit to the last stated digit (including trailing zeros).</p>
<div class="example">0.004560 has <b>4 s.f.</b>; 0.00456 has <b>3 s.f.</b></div>
<h3>3. Scientific notation</h3>
<div class="formula">a × 10ⁿ, 1 ≤ a &lt; 10</div>
<div class="example">45 600 000 = 4.56 × 10⁷; 0.00032 = 3.2 × 10⁻⁴</div>
<h3>4. Estimation</h3>
<div class="example">498 × 21 ≈ 500 × 20 = <b>10 000</b> (actual 10 458)</div>
<h3>5. Errors</h3>
<div class="formula">absolute error = |approx − true|; relative error = absolute error ÷ true × 100%</div>
<div class="warn">⚠️ Leading zeros are not significant: 0.0305 has 3 s.f.</div>`},

'f1-6':{
zh:`<h3>一、角的分類</h3>
<ul>
<li><b>銳角</b>：0° &lt; θ &lt; 90°</li>
<li><b>直角</b>：θ = 90°</li>
<li><b>鈍角</b>：90° &lt; θ &lt; 180°</li>
<li><b>平角</b>：θ = 180°</li>
<li><b>反角</b>：180° &lt; θ &lt; 360°</li>
</ul>
<h3>二、兩角關係</h3>
<ul>
<li><b>互補角</b>：兩角相加 = 90°（組成直角）</li>
<li><b>補角</b>：兩角相加 = 180°（組成直線）</li>
<li><b>對頂角</b>：兩直線相交形成，對頂角相等</li>
</ul>
<h3>三、三角形內角和</h3>
<div class="formula">∠A + ∠B + ∠C = 180°</div>
<div class="example"><b>例：</b>三角形兩個內角為 45° 和 68°，第三角 = 180 − 45 − 68 = <b>67°</b></div>
<h4>三角形外角定理</h4>
<p>三角形的<b>外角</b>等於<b>兩個不相鄰內角之和</b>。</p>
<div class="example"><b>例：</b>不相鄰兩內角為 35° 和 80°，則外角 = 35 + 80 = <b>115°</b></div>
<h3>四、平行線的角</h3>
<p>設 l₁ ∥ l₂，被截線 m 所截：</p>
<ul>
<li><b>同位角</b>相等（位置相同，如都在「左上」）</li>
<li><b>內錯角</b>相等（夾在兩平行線之間、在截線兩側）</li>
<li><b>同旁內角</b>互補（夾在兩平行線之間、在截線同側，相加 180°）</li>
</ul>
<div class="example"><b>例：</b>兩平行線被截，一個內錯角為 65°，另一個內錯角也是 <b>65°</b>；與之同旁內角為 <b>115°</b>。</div>
<h3>五、多邊形內角和</h3>
<div class="formula">n 邊形內角和 = (n − 2) × 180°</div>
<div class="formula">正 n 邊形每個內角 = (n − 2) × 180° ÷ n</div>
<div class="formula">多邊形外角和 = 360°（任何凸多邊形）</div>
<div class="example"><b>例：</b>正五邊形每個內角 = (5 − 2) × 180° ÷ 5 = 540 ÷ 5 = <b>108°</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把「同旁內角互補」記成「相等」；把「內錯角」與「同位角」的位置搞混。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：大三巴牌坊的石階與地面、欄杆形成平行線，可用同位角原理檢查是否水平。</div>`,
en:`<h3>1. Types of angles</h3>
<p>Acute &lt;90°, right =90°, obtuse 90°–180°, straight =180°, reflex 180°–360°.</p>
<h3>2. Angle pairs</h3>
<ul>
<li>Complementary: sum = 90°</li>
<li>Supplementary: sum = 180°</li>
<li>Vertically opposite angles are equal</li>
</ul>
<h3>3. Triangle angle sum</h3>
<div class="formula">∠A + ∠B + ∠C = 180°</div>
<div class="example">45° and 68° → third angle = <b>67°</b></div>
<p><b>Exterior angle theorem</b>: an exterior angle equals the sum of the two opposite interior angles.</p>
<div class="example">35° + 80° → exterior angle = <b>115°</b></div>
<h3>4. Parallel lines</h3>
<ul>
<li><b>Corresponding angles</b> are equal</li>
<li><b>Alternate angles</b> are equal</li>
<li><b>Co-interior angles</b> are supplementary</li>
</ul>
<div class="example">An alternate angle of 65° pairs with a co-interior angle of <b>115°</b>.</div>
<h3>5. Polygons</h3>
<div class="formula">Interior angle sum = (n − 2) × 180°</div>
<div class="formula">Regular n-gon interior angle = (n − 2) × 180° ÷ n</div>
<div class="formula">Exterior angle sum = 360°</div>
<div class="example">Regular pentagon: 540 ÷ 5 = <b>108°</b></div>
<div class="warn">⚠️ Co-interior angles are supplementary (not equal).</div>`},

'f1-7':{
zh:`<h3>一、周界</h3>
<p>圖形<b>邊界一圈的總長</b>稱為周界。周界是長度，單位是 cm、m 等。</p>
<h3>二、面積公式總表</h3>
<h4>長方形</h4>
<div class="formula">面積 = 長 × 闊　　周界 = 2 × (長 + 闊)</div>
<h4>正方形</h4>
<div class="formula">面積 = 邊長²　　周界 = 4 × 邊長</div>
<h4>三角形</h4>
<div class="formula">面積 = 底 × 高 ÷ 2</div>
<p>注意：<b>高必須垂直於底</b>，不是斜邊的長度。</p>
<h4>平行四邊形</h4>
<div class="formula">面積 = 底 × 高</div>
<h4>梯形</h4>
<div class="formula">面積 = (上底 + 下底) × 高 ÷ 2</div>
<h4>圓</h4>
<div class="formula">面積 = πr²　　周界（圓周）= 2πr = πd</div>
<p>π ≈ 3.14 或 22/7，依題目要求取近似值。</p>
<h3>三、組合圖形</h3>
<p>把複雜圖形<b>分割</b>成幾個基本圖形，分別求面積後相加；或<b>補形</b>後用大圖形減去多餘部分。</p>
<div class="example"><b>例：</b>半徑 6 cm 的圓，面積 = π × 6² = 36π ≈ <b>113.1 cm²</b>（π ≈ 3.1416）。<br>周界 = 2π × 6 ≈ 37.7 cm。</div>
<div class="example"><b>例（分割）：</b>長 10 cm、闊 6 cm 的長方形，右下角挖去一個底 4 cm、高 3 cm 的三角形。<br>面積 = 10 × 6 − 4 × 3 ÷ 2 = 60 − 6 = <b>54 cm²</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：求三角形面積時用了斜邊當高；求圓面積時用了直徑 r = d（應為 r = d ÷ 2）。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：議事亭前地的波浪碎石地磚，可把它分割成長方形與三角形，估算整片廣場的鋪磚面積。</div>`,
en:`<h3>1. Perimeter</h3>
<p>Total length around the boundary, measured in cm, m, etc.</p>
<h3>2. Area formulas</h3>
<div class="formula">Rectangle: A = l × w, P = 2(l + w)</div>
<div class="formula">Square: A = s², P = 4s</div>
<div class="formula">Triangle: A = base × height ÷ 2</div>
<p>The height must be <b>perpendicular</b> to the base.</p>
<div class="formula">Parallelogram: A = base × height</div>
<div class="formula">Trapezium: A = (a + b) × h ÷ 2</div>
<div class="formula">Circle: A = πr², C = 2πr = πd</div>
<h3>3. Composite figures</h3>
<p>Split the shape into basic figures, or subtract the extra parts from a larger figure.</p>
<div class="example">Circle r = 6 cm: A = 36π ≈ <b>113.1 cm²</b>; C ≈ 37.7 cm</div>
<div class="example">10 × 6 rectangle minus a 4 × 3 triangle = 60 − 6 = <b>54 cm²</b></div>
<div class="warn">⚠️ Use the perpendicular height, not the slant side. For a circle, r = d ÷ 2.</div>
<div class="tip">🇲🇴 Macau: split the wave-pattern pavement at Senado Square into rectangles and triangles.</div>`},

'f1-8':{
zh:`<h3>一、平均數（算術平均數）</h3>
<div class="formula">平均數 = 所有數據之和 ÷ 數據個數</div>
<div class="example"><b>例：</b>五位同學測驗分數為 72、85、90、68、80。<br>總和 = 395，平均 = 395 ÷ 5 = <b>79 分</b></div>
<p><b>性質</b>：每個數據與平均數之差的總和為 0；平均數容易受<b>極端值</b>影響。</p>
<h3>二、中位數</h3>
<p>把數據<b>由小到大排列</b>後：</p>
<ul>
<li>數據個數為<b>奇數</b>：中位數為正中間的那個數</li>
<li>數據個數為<b>偶數</b>：中位數為中間兩個數的平均數</li>
</ul>
<div class="example"><b>例：</b>2, 3, 3, 5, 9 → 中位數 = <b>3</b><br>2, 3, 5, 9 → 中位數 = (3 + 5) ÷ 2 = <b>4</b></div>
<h3>三、眾數</h3>
<p>出現<b>次數最多</b>的數據。可能沒有眾數，也可能有多個眾數。</p>
<div class="example"><b>例：</b>1, 2, 2, 3, 3, 3, 4 → 眾數 = <b>3</b>（出現 3 次）</div>
<h3>四、三者的比較</h3>
<ul>
<li><b>平均數</b>：用到全部數據，但受極端值影響大</li>
<li><b>中位數</b>：不受極端值影響，適合有極端值的數據</li>
<li><b>眾數</b>：反映最常出現的情況，適合分類數據</li>
</ul>
<h3>五、統計圖</h3>
<ul>
<li><b>棒形圖</b>：比較不同類別的數量</li>
<li><b>折線圖</b>：顯示數據隨時間的變化趨勢</li>
<li><b>圓形圖</b>：顯示各部分佔整體的比例（各部分百分比之和 = 100%，圓心角之和 = 360°）</li>
</ul>
<div class="example"><b>例（圓形圖）：</b>某部分佔 25%，其圓心角 = 360° × 25% = <b>90°</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：求中位數前忘記排序；圓形圖的百分比沒有加總到 100%。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：用圓形圖表示澳門旅客的來源地比例（內地、香港、台灣、其他），各扇形百分比之和必須是 100%。</div>`,
en:`<h3>1. Mean</h3>
<div class="formula">Mean = sum of values ÷ number of values</div>
<div class="example">72, 85, 90, 68, 80 → 395 ÷ 5 = <b>79</b></div>
<p>The mean uses all data but is strongly affected by extreme values.</p>
<h3>2. Median</h3>
<p>Arrange the data in order. Odd count → middle value; even count → mean of the two middle values.</p>
<div class="example">2, 3, 3, 5, 9 → <b>3</b>; 2, 3, 5, 9 → <b>4</b></div>
<h3>3. Mode</h3>
<p>The most frequent value. There may be none, or several.</p>
<div class="example">1, 2, 2, 3, 3, 3, 4 → mode = <b>3</b></div>
<h3>4. Comparison</h3>
<ul>
<li>Mean: uses all data, affected by extremes</li>
<li>Median: robust to extremes</li>
<li>Mode: shows the most common value</li>
</ul>
<h3>5. Charts</h3>
<p>Bar chart (compare), line graph (trend), pie chart (proportion — sectors sum to 100% and 360°).</p>
<div class="example">A 25% sector → 360° × 25% = <b>90°</b></div>
<div class="warn">⚠️ Sort the data before finding the median.</div>
<div class="tip">🇲🇴 Macau: a pie chart of visitor origins must sum to 100%.</div>`},

/* ================= F2 ================= */
'f2-1':{
zh:`<h3>一、指數的意義</h3>
<p>aⁿ 表示 a 自乘 n 次：aⁿ = a × a × … × a（共 n 個）。a 叫底數，n 叫指數。</p>
<div class="example">2⁵ = 2 × 2 × 2 × 2 × 2 = <b>32</b></div>
<h3>二、五條指數律</h3>
<div class="formula">① a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup>（同底相乘，指數相加）</div>
<div class="formula">② a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>（同底相除，指數相減）</div>
<div class="formula">③ (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>（冪的冪，指數相乘）</div>
<div class="formula">④ (ab)<sup>n</sup> = a<sup>n</sup>b<sup>n</sup>；(a/b)<sup>n</sup> = a<sup>n</sup>/b<sup>n</sup></div>
<div class="formula">⑤ a<sup>0</sup> = 1（a ≠ 0）　　　a<sup>−n</sup> = 1 / a<sup>n</sup></div>
<h3>三、例題示範</h3>
<div class="example"><b>例 1：</b>2³ × 2⁴ = 2<sup>3+4</sup> = 2⁷ = <b>128</b></div>
<div class="example"><b>例 2：</b>3⁵ ÷ 3² = 3<sup>5−2</sup> = 3³ = <b>27</b></div>
<div class="example"><b>例 3：</b>(x²)³ = x<sup>2×3</sup> = <b>x⁶</b></div>
<div class="example"><b>例 4：</b>5<sup>−2</sup> = 1 / 5² = <b>1/25 = 0.04</b></div>
<div class="example"><b>例 5（混合）：</b>化簡 (2x³)² × x⁻¹<br>= 4x⁶ × x⁻¹ = 4x<sup>6−1</sup> = <b>4x⁵</b></div>
<h3>四、科學記數法</h3>
<div class="formula">a × 10ⁿ，1 ≤ a &lt; 10</div>
<div class="example"><b>例：</b>(3 × 10⁴) × (2 × 10⁻²) = 6 × 10² = <b>600</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把 a<sup>m</sup> + a<sup>n</sup> 誤算成 a<sup>m+n</sup>。<b>指數律只適用於乘除</b>；a<sup>m</sup> + a<sup>n</sup> 不能合併。又如 (2x)² = 4x²，不是 2x²。</div>
<div class="tip">🇲🇴 <b>應用</b>：計算細菌繁殖、複利、電腦記憶體容量（KB → MB → GB 都是 10³ 進位）時都會用到指數。</div>`,
en:`<h3>1. Meaning of indices</h3>
<p>aⁿ = a × a × … × a (n factors). a is the base, n is the index.</p>
<div class="example">2⁵ = <b>32</b></div>
<h3>2. Five index laws</h3>
<div class="formula">① a<sup>m</sup> × a<sup>n</sup> = a<sup>m+n</sup></div>
<div class="formula">② a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup></div>
<div class="formula">③ (a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup></div>
<div class="formula">④ (ab)<sup>n</sup> = a<sup>n</sup>b<sup>n</sup></div>
<div class="formula">⑤ a<sup>0</sup> = 1; a<sup>−n</sup> = 1/a<sup>n</sup></div>
<h3>3. Worked examples</h3>
<div class="example">2³ × 2⁴ = 2⁷ = <b>128</b></div>
<div class="example">3⁵ ÷ 3² = 3³ = <b>27</b></div>
<div class="example">(x²)³ = <b>x⁶</b></div>
<div class="example">5<sup>−2</sup> = <b>1/25</b></div>
<div class="example">(2x³)² × x⁻¹ = 4x⁶ × x⁻¹ = <b>4x⁵</b></div>
<h3>4. Scientific notation</h3>
<div class="example">(3 × 10⁴)(2 × 10⁻²) = 6 × 10² = <b>600</b></div>
<div class="warn">⚠️ Index laws do <b>not</b> apply to addition. Also (2x)² = 4x².</div>`},

'f2-2':{
zh:`<h3>一、多項式的定義</h3>
<p>由數與字母經加、減、乘（乘方）組成的式子，叫多項式。例如 3x² − 2x + 5。</p>
<ul>
<li><b>項</b>：以加減號分隔的部分</li>
<li><b>次數</b>：最高次項的指數</li>
<li><b>常數項</b>：不含字母的項</li>
</ul>
<h3>二、展開多項式</h3>
<p>用<b>分配律</b>逐項相乘，再合併同類項。</p>
<div class="example"><b>例 1：</b>(x + 3)(x − 2)<br>= x² − 2x + 3x − 6<br>= <b>x² + x − 6</b></div>
<div class="example"><b>例 2：</b>(2x − 1)(3x + 4)<br>= 6x² + 8x − 3x − 4<br>= <b>6x² + 5x − 4</b></div>
<h3>三、三個重要恒等式</h3>
<div class="formula">(a + b)² = a² + 2ab + b²</div>
<div class="formula">(a − b)² = a² − 2ab + b²</div>
<div class="formula">(a + b)(a − b) = a² − b²</div>
<div class="example"><b>例：</b>(x + 4)² = x² + 8x + 16<br>(2x − 3)² = 4x² − 12x + 9<br>(x + 7)(x − 7) = x² − 49</div>
<h3>四、恒等式的意義與應用</h3>
<p><b>恒等式</b>是對<b>所有</b>數值都成立的等式。常用方法：<b>比較係數</b>。</p>
<div class="example"><b>例：</b>若 x² + ax + 12 ≡ (x + 3)(x + b)，求 a、b。<br>右邊展開 = x² + (b + 3)x + 3b<br>比較常數項：3b = 12 → b = 4<br>比較 x 項：a = b + 3 = <b>7</b></div>
<h3>五、多項式的除法（長除法）</h3>
<p>把被除式按降冪排列，用長除法可求商式與餘式。</p>
<div class="example"><b>例：</b>(x² + 5x + 6) ÷ (x + 2) = <b>x + 3</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：(a + b)² ≠ a² + b²，必須加上中間項 2ab。展開 (x − 3)² 得 x² − 6x + 9，不是 x² − 9。</div>
<div class="tip">🇲🇴 <b>驗算技巧</b>：恒等式可代入簡單數值（如 x = 1）快速檢查左右是否相等。</div>`,
en:`<h3>1. Polynomials</h3>
<p>Expressions built from numbers and letters using +, −, ×. e.g. 3x² − 2x + 5: terms, degree, constant term.</p>
<h3>2. Expansion</h3>
<div class="example">(x + 3)(x − 2) = x² + x − 6</div>
<div class="example">(2x − 1)(3x + 4) = 6x² + 5x − 4</div>
<h3>3. Three key identities</h3>
<div class="formula">(a + b)² = a² + 2ab + b²</div>
<div class="formula">(a − b)² = a² − 2ab + b²</div>
<div class="formula">(a + b)(a − b) = a² − b²</div>
<div class="example">(x + 4)² = x² + 8x + 16; (x + 7)(x − 7) = x² − 49</div>
<h3>4. Identities & comparing coefficients</h3>
<div class="example">If x² + ax + 12 ≡ (x + 3)(x + b), expanding gives 3b = 12 → b = 4, a = 7.</div>
<div class="warn">⚠️ (a + b)² ≠ a² + b² — never forget the 2ab term.</div>
<div class="tip">🇲🇴 Substitute a simple value such as x = 1 to check an identity quickly.</div>`},

'f2-3':{
zh:`<h3>一、因式分解是甚麼？</h3>
<p>把一個多項式寫成<b>幾個整式的乘積</b>，叫因式分解。它是展開的逆運算。</p>
<h3>二、方法一：提取公因式</h3>
<p>找出各項的<b>最大公因式</b>（係數取最大公因數、字母取最低次冪）。</p>
<div class="example"><b>例 1：</b>6x² + 9x = <b>3x(2x + 3)</b></div>
<div class="example"><b>例 2：</b>12a²b − 8ab² = <b>4ab(3a − 2b)</b></div>
<h3>三、方法二：十字相乘法</h3>
<p>用於 x² + bx + c 形式：找兩個數，<b>乘積 = c、和 = b</b>。</p>
<div class="example"><b>例 1：</b>x² + 5x + 6<br>找兩數：2 × 3 = 6，2 + 3 = 5<br>→ <b>(x + 2)(x + 3)</b></div>
<div class="example"><b>例 2：</b>x² − 7x + 10<br>找兩數：−2 × −5 = 10，−2 + (−5) = −7<br>→ <b>(x − 2)(x − 5)</b></div>
<div class="example"><b>例 3（首項係數不為 1）：</b>2x² + 7x + 3<br>拆成 (2x + 1)(x + 3)，驗算：2x² + 6x + x + 3 = 2x² + 7x + 3 ✅</div>
<h3>四、方法三：平方差</h3>
<div class="formula">a² − b² = (a + b)(a − b)</div>
<div class="example"><b>例：</b>x² − 16 = (x + 4)(x − 4)<br>4x² − 25 = (2x + 5)(2x − 5)</div>
<h3>五、方法四：完全平方</h3>
<div class="formula">a² + 2ab + b² = (a + b)²　　　a² − 2ab + b² = (a − b)²</div>
<div class="example"><b>例：</b>x² + 10x + 25 = <b>(x + 5)²</b></div>
<h3>六、解題策略</h3>
<ol>
<li>先看有沒有<b>公因式</b>（永遠先做）</li>
<li>再看是不是<b>平方差</b>或<b>完全平方</b></li>
<li>否則用<b>十字相乘</b></li>
</ol>
<div class="example"><b>例（綜合）：</b>分解 2x² − 8<br>= 2(x² − 4)（提公因式）<br>= <b>2(x + 2)(x − 2)</b>（平方差）</div>
<div class="warn">⚠️ <b>常見錯誤</b>：分解後沒有「分解到底」；忘記先提公因式；符號寫錯（(x − 2)(x + 3) 與 (x + 2)(x − 3) 不同）。</div>
<div class="tip">🎲 <b>檢查法</b>：把答案展開，看是否還原為原式。</div>`,
en:`<h3>1. What is factorisation?</h3>
<p>Writing a polynomial as a product of factors — the reverse of expansion.</p>
<h3>2. Common factor</h3>
<div class="example">6x² + 9x = <b>3x(2x + 3)</b></div>
<div class="example">12a²b − 8ab² = <b>4ab(3a − 2b)</b></div>
<h3>3. Cross method</h3>
<p>For x² + bx + c: find two numbers whose product is c and sum is b.</p>
<div class="example">x² + 5x + 6 = <b>(x + 2)(x + 3)</b></div>
<div class="example">x² − 7x + 10 = <b>(x − 2)(x − 5)</b></div>
<div class="example">2x² + 7x + 3 = <b>(2x + 1)(x + 3)</b></div>
<h3>4. Difference of squares</h3>
<div class="formula">a² − b² = (a + b)(a − b)</div>
<div class="example">x² − 16 = <b>(x + 4)(x − 4)</b>; 4x² − 25 = <b>(2x + 5)(2x − 5)</b></div>
<h3>5. Perfect squares</h3>
<div class="formula">a² ± 2ab + b² = (a ± b)²</div>
<div class="example">x² + 10x + 25 = <b>(x + 5)²</b></div>
<h3>6. Strategy</h3>
<ol><li>Take out the common factor first</li><li>Check for a difference of squares / perfect square</li><li>Otherwise use the cross method</li></ol>
<div class="example">2x² − 8 = 2(x² − 4) = <b>2(x + 2)(x − 2)</b></div>
<div class="warn">⚠️ Always factorise completely.</div>`},

'f2-4':{
zh:`<h3>一、不等式的符號</h3>
<ul>
<li><b>&lt;</b> 小於　<b>&gt;</b> 大於</li>
<li><b>≤</b> 小於或等於　<b>≥</b> 大於或等於</li>
</ul>
<h3>二、解一元一次不等式</h3>
<p>步驟與解方程相似：去括號 → 移項 → 化係數為 1。但有<b>一條關鍵規則</b>：</p>
<div class="warn">⚠️ <b>兩邊同乘以或同除以一個負數時，不等號的方向要改變！</b></div>
<div class="example"><b>例 1：</b>解 3x − 5 &lt; 10<br>3x &lt; 15<br>x &lt; <b>5</b></div>
<div class="example"><b>例 2（除以負數）：</b>解 −2x ≥ 8<br>兩邊同除以 −2，不等號反向<br>x ≤ <b>−4</b></div>
<div class="example"><b>例 3（含括號）：</b>解 4(x − 2) ≤ 2x + 6<br>4x − 8 ≤ 2x + 6<br>2x ≤ 14<br>x ≤ <b>7</b></div>
<h3>三、在數線上表示解集</h3>
<ul>
<li>x &gt; 3：在 3 畫空心圈，向右畫箭頭</li>
<li>x ≥ 3：在 3 畫實心點，向右畫箭頭</li>
<li>x &lt; 3：空心圈，向左</li>
</ul>
<h3>四、求整數解</h3>
<p>先求出不等式的解集，再從中挑出整數。</p>
<div class="example"><b>例：</b>x &lt; 5 的最大整數解是 <b>4</b>；x ≥ −2 的最小整數解是 <b>−2</b>。</div>
<div class="example"><b>例：</b>求 2x + 1 ≤ 11 的所有正整數解。<br>2x ≤ 10 → x ≤ 5 → 正整數解為 <b>1, 2, 3, 4, 5</b></div>
<h3>五、應用題</h3>
<div class="example"><b>例：</b>小明有 100 元，想買每本 18 元的筆記本，最多可買多少本？<br>設買 n 本：18n ≤ 100 → n ≤ 5.55…<br>n 為整數，故最多 <b>5 本</b>。</div>
<div class="warn">⚠️ <b>常見錯誤</b>：兩邊乘除負數時忘記變號；把 x &lt; 5 的最大整數解答成 5（5 本身不在解集內）。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：班會經費 500 元，每人餐費 45 元，最多可招待 500 ÷ 45 ≈ 11.1，即 <b>11 人</b>。</div>`,
en:`<h3>1. Symbols</h3>
<p>&lt; less than, &gt; greater than, ≤ at most, ≥ at least.</p>
<h3>2. Solving linear inequalities</h3>
<p>Same steps as equations, but:</p>
<div class="warn">⚠️ <b>Reverse the inequality sign when multiplying or dividing by a negative number.</b></div>
<div class="example">3x − 5 &lt; 10 → x &lt; <b>5</b></div>
<div class="example">−2x ≥ 8 → x ≤ <b>−4</b> (sign reversed)</div>
<div class="example">4(x − 2) ≤ 2x + 6 → 2x ≤ 14 → x ≤ <b>7</b></div>
<h3>3. Number line</h3>
<p>Open circle for &lt; or &gt;, filled dot for ≤ or ≥.</p>
<h3>4. Integer solutions</h3>
<div class="example">Greatest integer with x &lt; 5 is <b>4</b>.</div>
<div class="example">2x + 1 ≤ 11 → x ≤ 5 → positive integers: <b>1, 2, 3, 4, 5</b></div>
<h3>5. Applications</h3>
<div class="example">$100 with notebooks at $18: 18n ≤ 100 → n ≤ 5.55 → at most <b>5</b>.</div>
<div class="warn">⚠️ Do not forget to flip the sign.</div>`},

'f2-5':{
zh:`<h3>一、畢氏定理</h3>
<p>在<b>直角三角形</b>中，兩條直角邊的平方和等於斜邊的平方。</p>
<div class="formula">a² + b² = c²　（c 為斜邊，即直角所對的邊，也是最長邊）</div>
<h3>二、求斜邊</h3>
<div class="example"><b>例：</b>兩直角邊為 6 cm 和 8 cm，求斜邊。<br>c² = 6² + 8² = 36 + 64 = 100<br>c = <b>10 cm</b></div>
<h3>三、求直角邊</h3>
<div class="example"><b>例：</b>斜邊 13 cm，一條直角邊 5 cm，求另一條。<br>b² = 13² − 5² = 169 − 25 = 144<br>b = <b>12 cm</b></div>
<h3>四、畢氏定理的逆定理</h3>
<p>若三角形三邊 a、b、c（c 最長）滿足 a² + b² = c²，則該三角形是<b>直角三角形</b>，且 c 所對的角是直角。</p>
<div class="example"><b>例：</b>三邊 7、24、25。<br>7² + 24² = 49 + 576 = 625 = 25²<br>所以是<b>直角三角形</b>。</div>
<div class="example"><b>例：</b>三邊 4、5、6。<br>4² + 5² = 41，6² = 36，41 ≠ 36 → <b>不是</b>直角三角形。</div>
<h3>五、常見勾股數</h3>
<p>(3, 4, 5)、(5, 12, 13)、(8, 15, 17)、(7, 24, 25)，以及它們的整數倍（如 6, 8, 10）。</p>
<h3>六、應用題</h3>
<div class="example"><b>例：</b>一把 5 m 長的梯子靠在牆上，梯腳離牆 3 m，梯頂離地多高？<br>h² = 5² − 3² = 25 − 9 = 16 → h = <b>4 m</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：沒有確認哪條是斜邊就把三邊亂套公式；忘記在最後開平方根。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：要測量澳門旅遊塔與地面某一點的直線距離，可用畢氏定理計算水平距離與垂直高度的斜邊。</div>`,
en:`<h3>1. Pythagoras' Theorem</h3>
<p>In a right-angled triangle, the square of the hypotenuse equals the sum of the squares of the other two sides.</p>
<div class="formula">a² + b² = c² (c = hypotenuse)</div>
<h3>2. Finding the hypotenuse</h3>
<div class="example">Legs 6 and 8 → c² = 36 + 64 = 100 → c = <b>10</b></div>
<h3>3. Finding a leg</h3>
<div class="example">Hypotenuse 13, one leg 5 → b² = 169 − 25 = 144 → b = <b>12</b></div>
<h3>4. Converse</h3>
<p>If a² + b² = c² (c the longest side), the triangle is right-angled.</p>
<div class="example">7, 24, 25 → 49 + 576 = 625 = 25² → <b>right-angled</b></div>
<div class="example">4, 5, 6 → 41 ≠ 36 → <b>not</b> right-angled</div>
<h3>5. Common triples</h3>
<p>(3,4,5), (5,12,13), (8,15,17), (7,24,25) and their multiples.</p>
<h3>6. Applications</h3>
<div class="example">Ladder 5 m, foot 3 m from the wall → h² = 25 − 9 = 16 → h = <b>4 m</b></div>
<div class="warn">⚠️ Always identify the hypotenuse first.</div>`},

'f2-6':{
zh:`<h3>一、平行四邊形</h3>
<p><b>定義</b>：兩組對邊分別平行的四邊形。</p>
<p><b>性質</b>：</p>
<ul>
<li>對邊相等</li>
<li>對角相等</li>
<li>鄰角互補（相加 180°）</li>
<li>對角線互相平分</li>
</ul>
<div class="example"><b>例：</b>平行四邊形 ABCD 中 ∠A = 70°，則 ∠B = 180 − 70 = <b>110°</b>，∠C = 70°，∠D = 110°。</div>
<h3>二、特殊四邊形</h3>
<h4>菱形</h4>
<ul><li>四邊相等</li><li>對角線互相垂直且平分對角</li><li>面積 = 對角線乘積 ÷ 2</li></ul>
<h4>矩形</h4>
<ul><li>四個角都是直角</li><li>對角線相等且互相平分</li></ul>
<h4>正方形</h4>
<ul><li>同時具備菱形與矩形的所有性質</li><li>四邊相等、四角為直角、對角線相等且垂直</li></ul>
<h3>三、梯形</h3>
<p>只有一組對邊平行的四邊形。<b>等腰梯形</b>：兩腰相等，底角相等，對角線相等。</p>
<h3>四、多邊形內角和與外角和</h3>
<div class="formula">n 邊形內角和 = (n − 2) × 180°</div>
<div class="formula">任何凸多邊形外角和 = 360°</div>
<div class="formula">正 n 邊形每個外角 = 360° ÷ n，每個內角 = 180° − 360°/n</div>
<div class="example"><b>例：</b>正十邊形每個外角 = 360 ÷ 10 = <b>36°</b>，每個內角 = 180 − 36 = <b>144°</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把菱形和正方形的性質混淆（菱形對角線不一定相等）；求正多邊形內角時誤用 360°/n。</div>
<div class="tip">🇲🇴 <b>應用</b>：地磚鋪設常利用正方形、正六邊形等正多邊形，因為它們的內角能拼成 360°。</div>`,
en:`<h3>1. Parallelogram</h3>
<p>Two pairs of parallel opposite sides. Properties: opposite sides equal, opposite angles equal, adjacent angles supplementary, diagonals bisect each other.</p>
<div class="example">If ∠A = 70°, then ∠B = <b>110°</b>.</div>
<h3>2. Special quadrilaterals</h3>
<h4>Rhombus</h4>
<p>Four equal sides; diagonals perpendicular and bisect the angles; area = ½ d₁d₂.</p>
<h4>Rectangle</h4>
<p>Four right angles; diagonals equal and bisect each other.</p>
<h4>Square</h4>
<p>All rhombus and rectangle properties together.</p>
<h3>3. Trapezium</h3>
<p>Exactly one pair of parallel sides. Isosceles trapezium: equal legs, equal base angles, equal diagonals.</p>
<h3>4. Polygons</h3>
<div class="formula">Interior sum = (n − 2) × 180°; exterior sum = 360°</div>
<div class="formula">Regular n-gon: exterior = 360°/n, interior = 180° − 360°/n</div>
<div class="example">Regular decagon: exterior <b>36°</b>, interior <b>144°</b></div>
<div class="warn">⚠️ A rhombus does not necessarily have equal diagonals.</div>`},

'f2-7':{
zh:`<h3>一、柱體的體積</h3>
<p>柱體（棱柱、圓柱）的體積公式統一為：</p>
<div class="formula">體積 = 底面積 × 高</div>
<h3>二、長方體與正方體</h3>
<div class="formula">長方體體積 = 長 × 闊 × 高　　表面積 = 2(lw + lh + wh)</div>
<div class="formula">正方體體積 = 邊長³　　表面積 = 6 × 邊長²</div>
<div class="example"><b>例：</b>長 5 cm、闊 4 cm、高 3 cm 的長方體<br>體積 = 5 × 4 × 3 = <b>60 cm³</b><br>表面積 = 2(20 + 15 + 12) = <b>94 cm²</b></div>
<h3>三、三角柱</h3>
<div class="example"><b>例：</b>底面是底 6 cm、高 4 cm 的三角形，柱高 10 cm。<br>底面積 = 6 × 4 ÷ 2 = 12 cm²<br>體積 = 12 × 10 = <b>120 cm³</b></div>
<h3>四、圓柱</h3>
<div class="formula">體積 = πr²h</div>
<div class="formula">總表面積 = 2πr² + 2πrh</div>
<div class="example"><b>例：</b>r = 3 cm、h = 10 cm<br>V = π × 9 × 10 = 90π ≈ <b>282.7 cm³</b></div>
<h3>五、容量與單位換算</h3>
<div class="formula">1 cm³ = 1 mL　　1 000 cm³ = 1 L　　1 m³ = 1 000 L</div>
<div class="example"><b>例：</b>一個長方體水箱 50 cm × 40 cm × 30 cm，容積 = 60 000 cm³ = <b>60 L</b></div>
<h3>六、棱錐與圓錐（延伸）</h3>
<div class="formula">錐體體積 = 底面積 × 高 ÷ 3</div>
<div class="warn">⚠️ <b>常見錯誤</b>：把「高」與「斜高」混淆；計算圓柱表面積時漏算上下兩個底面，或把 2πr² 誤寫成 πr²。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：澳門旅遊塔塔身可近似看作一個圓柱段，用 πr²h 估算其體積。</div>`,
en:`<h3>1. Prisms and cylinders</h3>
<div class="formula">Volume = base area × height</div>
<h3>2. Cuboid & cube</h3>
<div class="formula">Cuboid: V = lwh, S = 2(lw + lh + wh)</div>
<div class="formula">Cube: V = s³, S = 6s²</div>
<div class="example">5 × 4 × 3: V = <b>60 cm³</b>, S = <b>94 cm²</b></div>
<h3>3. Triangular prism</h3>
<div class="example">Base triangle 6 × 4 ÷ 2 = 12 cm², height 10 → V = <b>120 cm³</b></div>
<h3>4. Cylinder</h3>
<div class="formula">V = πr²h; total surface area = 2πr² + 2πrh</div>
<div class="example">r = 3, h = 10 → V = 90π ≈ <b>282.7 cm³</b></div>
<h3>5. Units</h3>
<div class="formula">1 cm³ = 1 mL; 1000 cm³ = 1 L; 1 m³ = 1000 L</div>
<div class="example">50 × 40 × 30 cm = 60 000 cm³ = <b>60 L</b></div>
<h3>6. Pyramids & cones</h3>
<div class="formula">Volume = base area × height ÷ 3</div>
<div class="warn">⚠️ Do not confuse height with slant height. A cylinder has <b>two</b> circular ends.</div>`},

'f2-8':{
zh:`<h3>一、概率的意義</h3>
<div class="formula">P(事件) = 有利結果數 ÷ 所有可能的結果數</div>
<p>概率的值介於 0 與 1 之間。</p>
<ul>
<li>P(必然事件) = 1</li>
<li>P(不可能事件) = 0</li>
<li>0 &lt; P(隨機事件) &lt; 1</li>
</ul>
<h3>二、基本例題</h3>
<div class="example"><b>例 1：</b>擲一粒勻稱骰子，求 P(奇數)。<br>奇數有 1、3、5 共 3 個，共 6 個可能結果<br>P = 3/6 = <b>1/2 = 0.5</b></div>
<div class="example"><b>例 2：</b>袋中有 3 個紅球、5 個藍球、2 個綠球。<br>P(紅) = 3/10 = <b>0.3</b>；P(不是紅) = 1 − 0.3 = <b>0.7</b></div>
<h3>三、補事件</h3>
<div class="formula">P(事件不發生) = 1 − P(事件發生)</div>
<div class="example"><b>例：</b>某天降雨概率是 0.35，則不降雨的概率 = 1 − 0.35 = <b>0.65</b></div>
<h3>四、兩次抽取</h3>
<p>逐次抽取時可用<b>樹狀圖</b>或乘法原理。</p>
<div class="example"><b>例（有放回）：</b>袋中有 2 紅 3 藍，抽兩次（每次放回），兩次都是紅的概率。<br>P = (2/5) × (2/5) = <b>4/25 = 0.16</b></div>
<div class="example"><b>例（不放回）：</b>同上但不放回。<br>P = (2/5) × (1/4) = <b>2/20 = 0.1</b></div>
<h3>五、樹狀圖</h3>
<p>把每次的可能結果畫成樹枝，末端相乘、分支相加，可清楚計算複合事件的概率。</p>
<div class="warn">⚠️ <b>常見錯誤</b>：不放回抽取時忘記分母要減 1；把「至少一次」直接相加兩次概率（應先算補事件「一次都沒有」）。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：抽獎箱中有 3 張一等獎券、17 張安慰獎券，抽中一等獎的概率 = 3/20 = <b>0.15</b>。</div>`,
en:`<h3>1. Meaning</h3>
<div class="formula">P(event) = favourable outcomes ÷ total outcomes</div>
<p>0 ≤ P ≤ 1. P(certain) = 1, P(impossible) = 0.</p>
<h3>2. Basic examples</h3>
<div class="example">Fair die, P(odd) = 3/6 = <b>0.5</b></div>
<div class="example">3 red, 5 blue, 2 green: P(red) = <b>0.3</b>, P(not red) = <b>0.7</b></div>
<h3>3. Complementary events</h3>
<div class="formula">P(not A) = 1 − P(A)</div>
<div class="example">Rain probability 0.35 → no rain = <b>0.65</b></div>
<h3>4. Two draws</h3>
<div class="example"><b>With replacement</b> (2 red, 3 blue): (2/5)² = <b>0.16</b></div>
<div class="example"><b>Without replacement</b>: (2/5)(1/4) = <b>0.1</b></div>
<h3>5. Tree diagrams</h3>
<p>Multiply along branches, add across branches.</p>
<div class="warn">⚠️ Without replacement, the denominator decreases. For "at least one", use the complement.</div>`},

/* ================= F3 ================= */
'f3-1':{
zh:`<h3>一、一元二次方程的形式</h3>
<div class="formula">ax² + bx + c = 0　（a ≠ 0）</div>
<h3>二、解法一：因式分解法</h3>
<p>若能分解成 (x − p)(x − q) = 0，則 <b>x = p 或 x = q</b>（零乘積性質）。</p>
<div class="example"><b>例：</b>x² − 5x + 6 = 0<br>(x − 2)(x − 3) = 0<br><b>x = 2 或 x = 3</b></div>
<div class="example"><b>例：</b>2x² + 5x − 3 = 0<br>(2x − 1)(x + 3) = 0<br><b>x = 1/2 或 x = −3</b></div>
<h3>三、解法二：配方法</h3>
<p>把方程化成 (x + p)² = q 的形式，再開平方。</p>
<div class="example"><b>例：</b>x² + 6x − 7 = 0<br>x² + 6x = 7<br>x² + 6x + 9 = 16<br>(x + 3)² = 16<br>x + 3 = ±4 → <b>x = 1 或 x = −7</b></div>
<h3>四、解法三：公式法</h3>
<div class="formula">x = [−b ± √(b² − 4ac)] ÷ 2a</div>
<div class="example"><b>例：</b>解 2x² − 4x − 3 = 0<br>a = 2, b = −4, c = −3<br>b² − 4ac = 16 + 24 = 40<br>x = (4 ± √40) ÷ 4 = (4 ± 2√10) ÷ 4<br><b>x = (2 ± √10)/2</b></div>
<h3>五、判別式 Δ = b² − 4ac</h3>
<ul>
<li><b>Δ &gt; 0</b>：兩個相異實根</li>
<li><b>Δ = 0</b>：一個重根（兩根相等）</li>
<li><b>Δ &lt; 0</b>：沒有實根</li>
</ul>
<div class="example"><b>例：</b>判斷 x² + 2x + 5 = 0 的根的情況。<br>Δ = 4 − 20 = −16 &lt; 0 → <b>沒有實根</b></div>
<h3>六、根與係數的關係（韋達定理）</h3>
<div class="formula">兩根之和 α + β = −b/a　　兩根之積 αβ = c/a</div>
<div class="example"><b>例：</b>x² − 5x + 6 = 0 的兩根為 2 和 3。<br>和 = 5 = −(−5)/1 ✅　積 = 6 = 6/1 ✅</div>
<div class="warn">⚠️ <b>常見錯誤</b>：代入公式時忘記 b 的負號；判別式算出負數仍寫「有實根」；因式分解後寫成 x = 2 和 x = 3（應為「或」）。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：在大三巴前地拋出的球，其高度 h = −5t² + 20t + 1.5，令 h = 0 解二次方程可求落地時間。</div>`,
en:`<h3>1. Standard form</h3>
<div class="formula">ax² + bx + c = 0 (a ≠ 0)</div>
<h3>2. Factorisation</h3>
<div class="example">x² − 5x + 6 = 0 → (x − 2)(x − 3) = 0 → <b>x = 2 or 3</b></div>
<h3>3. Completing the square</h3>
<div class="example">x² + 6x − 7 = 0 → (x + 3)² = 16 → <b>x = 1 or −7</b></div>
<h3>4. Quadratic formula</h3>
<div class="formula">x = [−b ± √(b² − 4ac)] ÷ 2a</div>
<div class="example">2x² − 4x − 3 = 0 → Δ = 40 → x = (2 ± √10)/2</div>
<h3>5. Discriminant Δ = b² − 4ac</h3>
<ul><li>Δ &gt; 0: two distinct real roots</li><li>Δ = 0: one repeated root</li><li>Δ &lt; 0: no real roots</li></ul>
<div class="example">x² + 2x + 5 = 0 → Δ = −16 &lt; 0 → <b>no real roots</b></div>
<h3>6. Sum and product of roots</h3>
<div class="formula">α + β = −b/a, αβ = c/a</div>
<div class="warn">⚠️ Watch the sign of b in the formula.</div>`},

'f3-2':{
zh:`<h3>一、二次函數的圖像</h3>
<p>y = ax² + bx + c（a ≠ 0）的圖像是一條<b>拋物線</b>。</p>
<ul>
<li>a &gt; 0：開口<b>向上</b>，有<b>極小值</b></li>
<li>a &lt; 0：開口<b>向下</b>，有<b>極大值</b></li>
<li>|a| 越大，開口越窄</li>
</ul>
<h3>二、頂點式</h3>
<div class="formula">y = a(x − h)² + k</div>
<p>頂點為 <b>(h, k)</b>，對稱軸為直線 <b>x = h</b>。</p>
<div class="example"><b>例：</b>y = 2(x − 3)² + 5<br>頂點 (3, 5)，對稱軸 x = 3，因為 a = 2 &gt; 0，故極小值 = <b>5</b></div>
<div class="example"><b>例：</b>y = −(x + 2)² + 9<br>頂點 (−2, 9)，對稱軸 x = −2，極大值 = <b>9</b></div>
<h3>三、一般式求頂點</h3>
<div class="formula">對稱軸 x = −b / (2a)　　頂點 y 坐標 = 4ac − b² / (4a)</div>
<div class="example"><b>例：</b>y = x² − 6x + 5<br>對稱軸 x = 6/2 = 3<br>頂點 y = 3² − 6(3) + 5 = <b>−4</b><br>頂點 (3, −4)，極小值 −4</div>
<h3>四、與坐標軸的交點</h3>
<ul>
<li><b>y 軸截距</b>：令 x = 0，得 y = c，交點 (0, c)</li>
<li><b>x 軸截距</b>：令 y = 0，解二次方程 ax² + bx + c = 0</li>
</ul>
<div class="example"><b>例：</b>y = x² − 6x + 5<br>y 截距 (0, 5)<br>解 x² − 6x + 5 = 0 → (x − 1)(x − 5) = 0 → x 截距 (1, 0) 和 (5, 0)</div>
<h3>五、判別式與圖像</h3>
<ul>
<li>Δ &gt; 0：拋物線與 x 軸交於兩點</li>
<li>Δ = 0：與 x 軸相切於一點（頂點在 x 軸上）</li>
<li>Δ &lt; 0：與 x 軸沒有交點</li>
</ul>
<div class="warn">⚠️ <b>常見錯誤</b>：把頂點的橫坐標誤寫成 b/(2a)（應為 −b/(2a)）；把 a &gt; 0 的圖像說成「有極大值」。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：在大三巴前地拋出的球，其高度隨時間變化的軌跡是一條<b>開口向下</b>的拋物線，頂點代表球到達的最高點。</div>`,
en:`<h3>1. The graph</h3>
<p>y = ax² + bx + c is a <b>parabola</b>. a &gt; 0 opens upward (minimum); a &lt; 0 opens downward (maximum).</p>
<h3>2. Vertex form</h3>
<div class="formula">y = a(x − h)² + k → vertex (h, k), axis x = h</div>
<div class="example">y = 2(x − 3)² + 5 → vertex (3, 5), minimum <b>5</b></div>
<div class="example">y = −(x + 2)² + 9 → vertex (−2, 9), maximum <b>9</b></div>
<h3>3. Vertex from general form</h3>
<div class="formula">axis x = −b/(2a)</div>
<div class="example">y = x² − 6x + 5 → axis x = 3, vertex (3, −4)</div>
<h3>4. Intercepts</h3>
<p>y-intercept: set x = 0 → (0, c). x-intercepts: set y = 0 and solve.</p>
<div class="example">y = x² − 6x + 5 → (0,5), (1,0), (5,0)</div>
<h3>5. Discriminant and the graph</h3>
<p>Δ &gt; 0: two intersections; Δ = 0: tangent to the x-axis; Δ &lt; 0: no intersection.</p>
<div class="warn">⚠️ The axis is x = −b/(2a), not b/(2a).</div>
<div class="tip">🇲🇴 Macau: a ball thrown near the Ruins of St. Paul's follows a downward parabola.</div>`},

'f3-3':{
zh:`<h3>一、反比例關係</h3>
<p>當 x 增大時 y 相應減小，且乘積保持不變，稱 y 與 x 成<b>反比</b>。</p>
<div class="formula">y = k / x　或　xy = k　（k ≠ 0，稱為比例常數）</div>
<h3>二、求比例常數</h3>
<div class="example"><b>例：</b>已知 y 與 x 成反比，且 x = 2 時 y = 6。<br>k = xy = 2 × 6 = <b>12</b><br>所以 y = 12/x。當 x = 3 時，y = 12/3 = <b>4</b>。</div>
<h3>三、圖像</h3>
<p>y = k/x 的圖像是<b>雙曲線</b>，由兩支曲線組成：</p>
<ul>
<li>k &gt; 0：兩支分別在<b>第一、第三</b>象限</li>
<li>k &lt; 0：兩支分別在<b>第二、第四</b>象限</li>
<li>圖像<b>永遠不與坐標軸相交</b>（x ≠ 0、y ≠ 0）</li>
</ul>
<h3>四、與正比例的比較</h3>
<div class="formula">正比例：y = kx（圖像為過原點的直線）</div>
<div class="formula">反比例：y = k/x（圖像為雙曲線）</div>
<h3>五、應用題</h3>
<div class="example"><b>例 1：</b>路程固定為 120 km，速度 v 與時間 t 成反比。<br>v × t = 120。當 v = 60 km/h 時，t = <b>2 小時</b>；當 v = 40 km/h 時，t = <b>3 小時</b>。</div>
<div class="example"><b>例 2：</b>6 個人完成一項工程需 8 天，若 4 個人做，需多少天？<br>人數 × 天數 = 常數 = 6 × 8 = 48<br>4 × t = 48 → t = <b>12 天</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把反比例當成正比例（用 y = kx）；忘記 k ≠ 0；誤以為圖像與坐標軸有交點。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：從關閘到氹仔路程固定，行車速度與所需時間成反比——開快一倍，時間減半。</div>`,
en:`<h3>1. Inverse proportion</h3>
<div class="formula">y = k/x, i.e. xy = k (k ≠ 0)</div>
<h3>2. Finding k</h3>
<div class="example">y ∝ 1/x and y = 6 when x = 2 → k = 12; when x = 3, y = <b>4</b>.</div>
<h3>3. Graph</h3>
<p>The graph is a <b>hyperbola</b> with two branches. For k &gt; 0 they lie in quadrants I and III; for k &lt; 0 in II and IV. It never meets the axes.</p>
<h3>4. Compare with direct proportion</h3>
<div class="formula">Direct: y = kx (straight line through the origin)</div>
<div class="formula">Inverse: y = k/x (hyperbola)</div>
<h3>5. Applications</h3>
<div class="example">Fixed 120 km journey: v × t = 120. At 60 km/h, t = <b>2 h</b>.</div>
<div class="example">6 workers take 8 days → 4 workers take <b>12 days</b>.</div>
<div class="warn">⚠️ Do not use y = kx for inverse proportion.</div>`},

'f3-4':{
zh:`<h3>一、坐標平面回顧</h3>
<p>平面上任一點 P 可用有序數對 (x, y) 表示，x 為橫坐標，y 為縱坐標。</p>
<h3>二、兩點間的距離</h3>
<div class="formula">d = √[(x₂ − x₁)² + (y₂ − y₁)²]</div>
<div class="example"><b>例：</b>求 (1, 2) 與 (4, 6) 的距離。<br>d = √[(4−1)² + (6−2)²] = √(9 + 16) = √25 = <b>5</b></div>
<h3>三、中點公式</h3>
<div class="formula">中點 = ((x₁ + x₂)/2, (y₁ + y₂)/2)</div>
<div class="example"><b>例：</b>(1, 2) 與 (5, 8) 的中點 = ((1+5)/2, (2+8)/2) = <b>(3, 5)</b></div>
<h3>四、斜率</h3>
<div class="formula">m = (y₂ − y₁) ÷ (x₂ − x₁)　（x₁ ≠ x₂）</div>
<ul>
<li>m &gt; 0：直線向右上方傾斜</li>
<li>m &lt; 0：直線向右下方傾斜</li>
<li>m = 0：水平線</li>
<li>斜率不存在：垂直線</li>
</ul>
<div class="example"><b>例：</b>過 (1, 2) 和 (4, 8) 的直線斜率 = (8−2)/(4−1) = 6/3 = <b>2</b></div>
<h3>五、直線方程的兩種形式</h3>
<h4>斜截式</h4>
<div class="formula">y = mx + c　（m 為斜率，c 為 y 軸截距）</div>
<div class="example"><b>例：</b>斜率 3、y 截距 −2 的直線：<b>y = 3x − 2</b></div>
<h4>點斜式</h4>
<div class="formula">y − y₁ = m(x − x₁)</div>
<div class="example"><b>例：</b>過 (2, 1)、斜率 4 的直線<br>y − 1 = 4(x − 2) → y = 4x − 7</div>
<h3>六、平行與垂直</h3>
<div class="formula">平行：m₁ = m₂　　垂直：m₁ × m₂ = −1</div>
<div class="example"><b>例：</b>與 y = 2x + 1 平行的直線斜率也是 <b>2</b>；垂直的直線斜率是 <b>−1/2</b>。</div>
<div class="warn">⚠️ <b>常見錯誤</b>：斜率公式分子分母顛倒（應為 Δy/Δx）；垂直判斷誤用 m₁ = m₂。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：用直線方程描述澳門地圖上兩地點之間的路線方向，可計算行走的坡度。</div>`,
en:`<h3>1. Coordinates</h3>
<p>A point P is (x, y): x is the x-coordinate, y the y-coordinate.</p>
<h3>2. Distance</h3>
<div class="formula">d = √[(x₂ − x₁)² + (y₂ − y₁)²]</div>
<div class="example">(1,2) and (4,6) → √(9+16) = <b>5</b></div>
<h3>3. Midpoint</h3>
<div class="formula">M = ((x₁+x₂)/2, (y₁+y₂)/2)</div>
<div class="example">(1,2) and (5,8) → <b>(3,5)</b></div>
<h3>4. Slope</h3>
<div class="formula">m = (y₂ − y₁)/(x₂ − x₁)</div>
<div class="example">(1,2) and (4,8) → m = 6/3 = <b>2</b></div>
<h3>5. Equations</h3>
<div class="formula">Slope-intercept: y = mx + c</div>
<div class="formula">Point-slope: y − y₁ = m(x − x₁)</div>
<div class="example">Through (2,1), m = 4 → y = 4x − 7</div>
<h3>6. Parallel & perpendicular</h3>
<div class="formula">Parallel: m₁ = m₂; Perpendicular: m₁m₂ = −1</div>
<div class="warn">⚠️ Slope is Δy/Δx, not Δx/Δy.</div>`},

'f3-5':{
zh:`<h3>一、相似的意義</h3>
<p>兩個圖形<b>形狀相同、大小不一定相同</b>，稱為相似。相似三角形對應角相等、對應邊成比例。</p>
<h3>二、相似三角形的三個判定條件</h3>
<ul>
<li><b>AAA</b>（或 AA）：三個角（或兩個角）對應相等</li>
<li><b>SSS</b>：三邊對應成比例</li>
<li><b>SAS</b>：兩邊對應成比例，且夾角相等</li>
</ul>
<h3>三、相似比與邊長</h3>
<div class="formula">若 △ABC ~ △DEF，則 AB/DE = BC/EF = CA/FD = k（相似比）</div>
<div class="example"><b>例：</b>△ABC ~ △DEF，AB = 6 cm，DE = 9 cm，BC = 8 cm。求 EF。<br>相似比 = 6/9 = 2/3<br>BC/EF = 2/3 → 8/EF = 2/3 → EF = <b>12 cm</b></div>
<h3>四、面積比與體積比</h3>
<div class="formula">面積比 = （相似比）²</div>
<div class="formula">體積比 = （相似比）³</div>
<div class="example"><b>例：</b>相似比 2 : 3 → 面積比 = 4 : 9；體積比 = 8 : 27</div>
<div class="example"><b>例：</b>兩個相似三角形面積比為 16 : 25，求周界比。<br>邊長比 = √16 : √25 = <b>4 : 5</b>，即周界比 = 4 : 5</div>
<h3>五、應用：測量高度</h3>
<div class="example"><b>例：</b>小明身高 1.6 m，影子長 2 m；同一時刻旗杆影子長 12 m，求旗杆高度。<br>1.6/2 = h/12 → h = 1.6 × 12 ÷ 2 = <b>9.6 m</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把面積比直接當成邊長比（面積比是邊長比的平方）；對應邊找錯，導致比例寫反。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：用相似三角形（影子比例法）可以測量澳門旅遊塔、大三巴牌坊等建築物的高度，不需攀爬。</div>`,
en:`<h3>1. Similarity</h3>
<p>Same shape, possibly different size. Corresponding angles equal; corresponding sides proportional.</p>
<h3>2. Three tests</h3>
<ul><li><b>AAA / AA</b></li><li><b>SSS</b> (all three sides proportional)</li><li><b>SAS</b></li></ul>
<h3>3. Ratio of sides</h3>
<div class="formula">If △ABC ~ △DEF then AB/DE = BC/EF = CA/FD = k</div>
<div class="example">AB = 6, DE = 9, BC = 8 → EF = <b>12</b></div>
<h3>4. Area & volume ratios</h3>
<div class="formula">Area ratio = k²; Volume ratio = k³</div>
<div class="example">k = 2:3 → areas <b>4:9</b>, volumes <b>8:27</b></div>
<div class="example">Areas 16:25 → side ratio <b>4:5</b></div>
<h3>5. Applications</h3>
<div class="example">1.6 m person casts a 2 m shadow; a flagpole casts 12 m → h = <b>9.6 m</b></div>
<div class="warn">⚠️ The area ratio is the <b>square</b> of the side ratio.</div>`},

'f3-6':{
zh:`<h3>一、三個三角比的定義</h3>
<p>在<b>直角三角形</b>中，對於銳角 θ：</p>
<div class="formula">sin θ = 對邊 ÷ 斜邊</div>
<div class="formula">cos θ = 鄰邊 ÷ 斜邊</div>
<div class="formula">tan θ = 對邊 ÷ 鄰邊</div>
<p>記憶口訣：<b>SOH-CAH-TOA</b>。</p>
<h3>二、基本例題</h3>
<div class="example"><b>例：</b>直角三角形中，θ 的對邊 = 3、鄰邊 = 4、斜邊 = 5。<br>sin θ = 3/5 = <b>0.6</b><br>cos θ = 4/5 = <b>0.8</b><br>tan θ = 3/4 = <b>0.75</b></div>
<h3>三、求未知邊長</h3>
<div class="example"><b>例 1：</b>已知斜邊 = 10 cm，θ = 30°，求對邊。<br>sin 30° = 對邊/10 → 對邊 = 10 × 0.5 = <b>5 cm</b></div>
<div class="example"><b>例 2：</b>已知鄰邊 = 8 cm，θ = 40°，求對邊。<br>tan 40° = 對邊/8 → 對邊 = 8 × 0.8391 ≈ <b>6.71 cm</b></div>
<h3>四、特殊角的值</h3>
<div class="formula">sin 30° = 1/2　cos 30° = √3/2　tan 30° = 1/√3</div>
<div class="formula">sin 45° = cos 45° = √2/2　tan 45° = 1</div>
<div class="formula">sin 60° = √3/2　cos 60° = 1/2　tan 60° = √3</div>
<h3>五、仰角與俯角</h3>
<ul>
<li><b>仰角</b>：由水平線向上看的角</li>
<li><b>俯角</b>：由水平線向下看的角</li>
</ul>
<div class="example"><b>例：</b>在距離澳門旅遊塔 100 m 處，測得塔頂仰角為 65°，求塔高。<br>tan 65° = h/100 → h = 100 × 2.1445 ≈ <b>214.5 m</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把對邊與鄰邊的位置搞錯（取決於你觀察的是哪個角）；計算仰角題時忘記加上測量者的身高。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：在澳門旅遊塔外測量塔頂仰角，配合距離即可用 tan 計算塔高——這是測量學的基本方法。</div>`,
en:`<h3>1. Definitions</h3>
<div class="formula">sin θ = opposite / hypotenuse</div>
<div class="formula">cos θ = adjacent / hypotenuse</div>
<div class="formula">tan θ = opposite / adjacent</div>
<p>Remember <b>SOH-CAH-TOA</b>.</p>
<h3>2. Example</h3>
<div class="example">Opposite 3, adjacent 4, hypotenuse 5 → sin θ = <b>0.6</b>, cos θ = <b>0.8</b>, tan θ = <b>0.75</b></div>
<h3>3. Finding sides</h3>
<div class="example">Hypotenuse 10, θ = 30° → opposite = 10 × 0.5 = <b>5 cm</b></div>
<div class="example">Adjacent 8, θ = 40° → opposite = 8 × 0.8391 ≈ <b>6.71 cm</b></div>
<h3>4. Special angles</h3>
<div class="formula">sin 30° = ½, cos 30° = √3/2, tan 30° = 1/√3</div>
<div class="formula">sin 45° = cos 45° = √2/2, tan 45° = 1</div>
<div class="formula">sin 60° = √3/2, cos 60° = ½, tan 60° = √3</div>
<h3>5. Angles of elevation & depression</h3>
<div class="example">100 m from Macau Tower, elevation 65° → h = 100 tan 65° ≈ <b>214.5 m</b></div>
<div class="warn">⚠️ Identify opposite and adjacent relative to the angle you are using.</div>`},

'f3-7':{
zh:`<h3>一、圓的基本元素</h3>
<ul>
<li><b>圓心</b> O、<b>半徑</b> r、<b>直徑</b> d = 2r</li>
<li><b>弦</b>：圓上兩點連成的線段</li>
<li><b>弧</b>：圓上的一段曲線</li>
<li><b>切線</b>：與圓只有一個交點的直線</li>
</ul>
<h3>二、圓心角與圓周角</h3>
<div class="formula">同一弧所對的圓心角 = 2 × 圓周角</div>
<div class="example"><b>例：</b>某弧所對的圓心角為 100°，則該弧所對的圓周角 = 100° ÷ 2 = <b>50°</b></div>
<div class="example"><b>例：</b>某弧所對的圓周角為 35°，則圓心角 = 2 × 35° = <b>70°</b></div>
<h3>三、半圓上的圓周角</h3>
<div class="formula">直徑所對的圓周角 = 90°</div>
<div class="example"><b>例：</b>若 AB 是直徑，C 在圓周上，則 ∠ACB = <b>90°</b></div>
<h3>四、同弓形的圓周角</h3>
<div class="formula">同一弓形內的圓周角相等</div>
<h3>五、切線的性質</h3>
<ul>
<li>切線<b>垂直</b>於過切點的半徑（∠OAT = 90°）</li>
<li>由圓外一點引兩條切線，<b>切線長相等</b></li>
</ul>
<div class="example"><b>例：</b>PA、PB 為從 P 點引出的兩條切線，PA = 5 cm，則 PB = <b>5 cm</b>。</div>
<h3>六、圓內接四邊形</h3>
<div class="formula">圓內接四邊形的對角互補（相加 180°）</div>
<div class="example"><b>例：</b>圓內接四邊形 ABCD 中 ∠A = 75°，則 ∠C = 180 − 75 = <b>105°</b>。</div>
<h3>七、弧長與扇形面積</h3>
<div class="formula">弧長 = 2πr × (θ/360°)　　扇形面積 = πr² × (θ/360°)</div>
<div class="example"><b>例：</b>r = 6 cm、θ = 60° 的扇形，面積 = π × 36 × (60/360) = 6π ≈ <b>18.85 cm²</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：把圓心角與圓周角的位置搞反；忘記「直徑所對的圓周角是 90°」這個常用結論。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：議事亭前地的波浪碎石圖案，可以看成同心圓弧的設計，用弧長公式可估算鋪磚長度。</div>`,
en:`<h3>1. Basic terms</h3>
<p>Centre O, radius r, diameter d = 2r, chord, arc, tangent.</p>
<h3>2. Angle at centre vs circumference</h3>
<div class="formula">Angle at centre = 2 × angle at circumference (same arc)</div>
<div class="example">Centre angle 100° → circumference angle <b>50°</b></div>
<h3>3. Angle in a semicircle</h3>
<div class="formula">Angle subtended by a diameter = 90°</div>
<div class="example">AB is a diameter, C on the circle → ∠ACB = <b>90°</b></div>
<h3>4. Angles in the same segment</h3>
<div class="formula">Angles in the same segment are equal</div>
<h3>5. Tangent properties</h3>
<ul><li>Tangent ⊥ radius at the point of contact</li><li>Two tangents from an external point are equal in length</li></ul>
<div class="example">PA = PB = <b>5 cm</b></div>
<h3>6. Cyclic quadrilateral</h3>
<div class="formula">Opposite angles of a cyclic quadrilateral are supplementary</div>
<div class="example">∠A = 75° → ∠C = <b>105°</b></div>
<h3>7. Arc length & sector area</h3>
<div class="formula">Arc = 2πr × θ/360°; Sector area = πr² × θ/360°</div>
<div class="example">r = 6, θ = 60° → area = 6π ≈ <b>18.85 cm²</b></div>
<div class="warn">⚠️ Do not confuse angle at centre with angle at circumference.</div>`},

'f3-8':{
zh:`<h3>一、三個集中趨勢量度</h3>
<h4>平均數（Mean）</h4>
<div class="formula">平均數 = 總和 ÷ 數據個數</div>
<p>優點：使用全部數據；缺點：易受極端值影響。</p>
<div class="example"><b>例：</b>2, 3, 3, 5, 9 → 平均 = 22 ÷ 5 = <b>4.4</b></div>
<h4>中位數（Median）</h4>
<p>把數據排序後位於中間的數。奇數個取中間一個；偶數個取中間兩個的平均數。</p>
<div class="example"><b>例：</b>2, 3, 3, 5, 9 → 中位數 = <b>3</b><br>2, 3, 3, 5, 9, 10 → 中位數 = (3 + 5) ÷ 2 = <b>4</b></div>
<h4>眾數（Mode）</h4>
<p>出現次數最多的數據。可能有零個、一個或多個眾數。</p>
<div class="example"><b>例：</b>2, 3, 3, 5, 9 → 眾數 = <b>3</b></div>
<h3>二、三者的比較</h3>
<ul>
<li>數據有極端值（如收入、房價）→ 用<b>中位數</b>更能代表整體</li>
<li>數據較平均 → 三者接近</li>
<li>分類數據（如鞋碼、顏色）→ 用<b>眾數</b></li>
</ul>
<div class="example"><b>例：</b>某班 5 人月薪為 12000、13000、14000、15000、80000 元。<br>平均 = 26800 元（受 80000 嚴重拉高）<br>中位數 = <b>14000 元</b>（更能代表一般水平）</div>
<h3>三、由平均數反求數據</h3>
<div class="formula">總和 = 平均數 × 個數</div>
<div class="example"><b>例：</b>五位同學平均分 78 分，其中四位為 72、85、90、68，求第五位。<br>總和 = 78 × 5 = 390<br>第五位 = 390 − (72+85+90+68) = 390 − 315 = <b>75 分</b></div>
<h3>四、加權平均數</h3>
<div class="formula">加權平均 = Σ(數值 × 權重) ÷ Σ權重</div>
<div class="example"><b>例：</b>平時分 80（佔 30%）、考試 70（佔 70%）。<br>總分 = 80 × 0.3 + 70 × 0.7 = 24 + 49 = <b>73 分</b></div>
<div class="warn">⚠️ <b>常見錯誤</b>：求中位數前忘記排序；把「眾數」誤解為「中間的數」；加權平均時權重沒有加總為 1。</div>
<div class="tip">🇲🇴 <b>澳門情境</b>：比較澳門不同地區的樓價時，中位數比平均數更能反映一般市民的負擔水平。</div>`,
en:`<h3>1. Three measures</h3>
<h4>Mean</h4>
<div class="formula">Mean = sum ÷ count</div>
<p>Uses all data, but is affected by extreme values.</p>
<div class="example">2,3,3,5,9 → mean = <b>4.4</b></div>
<h4>Median</h4>
<p>Sort the data; take the middle value (or the mean of the two middle values).</p>
<div class="example">2,3,3,5,9 → <b>3</b>; 2,3,3,5,9,10 → <b>4</b></div>
<h4>Mode</h4>
<p>The most frequent value.</p>
<div class="example">2,3,3,5,9 → mode = <b>3</b></div>
<h3>2. Comparison</h3>
<p>With extreme values, the median is more representative. For categorical data, use the mode.</p>
<div class="example">12 000, 13 000, 14 000, 15 000, 80 000 → mean 26 800 but median <b>14 000</b></div>
<h3>3. Finding a missing value</h3>
<div class="formula">Sum = mean × count</div>
<div class="example">Mean 78 of 5 scores; four are 72, 85, 90, 68 → fifth = <b>75</b></div>
<h3>4. Weighted mean</h3>
<div class="formula">Weighted mean = Σ(value × weight) ÷ Σweight</div>
<div class="example">80 (30%) and 70 (70%) → <b>73</b></div>
<div class="warn">⚠️ Sort the data before finding the median.</div>`}
};

/* ============================================================
   5. 題庫（按課題 × 難度）
   ============================================================ */
const BANK = {};

/* --- 通用出題輔助 --- */
function mk(qzh, qen, ans, exzh, exen, tol){
  return {q:{zh:qzh,en:qen}, ans, ex:{zh:exzh,en:exen}, tol: tol==null?0.01:tol};
}

   a:{zh:`<b>指數律</b>\n\n① aᵐ × aⁿ = aᵐ⁺ⁿ\n② aᵐ ÷ aⁿ = aᵐ⁻ⁿ\n③ (aᵐ)ⁿ = aᵐⁿ\n④ (ab)ⁿ = aⁿbⁿ\n⑤ a⁰ = 1（a≠0），a⁻ⁿ = 1/aⁿ\n\n⚠️ 這些規律<b>只適用於乘除</b>！aᵐ + aⁿ 不能合併。\n⚠️ (2x)² = 4x²，不是 2x²。`,
      en:`<b>Index laws</b>\n\naᵐ×aⁿ=aᵐ⁺ⁿ; aᵐ÷aⁿ=aᵐ⁻ⁿ; (aᵐ)ⁿ=aᵐⁿ; a⁰=1; a⁻ⁿ=1/aⁿ.\n\n⚠️ These apply to × and ÷ only — not to addition.`}},
  {k:['圓','circle','圓周角','圓心角','切線','弦'],
   a:{zh:`<b>圓的常用性質</b>\n\n① 同一弧：圓心角 = 2 × 圓周角\n② 直徑所對的圓周角 = 90°\n③ 同弓形的圓周角相等\n④ 切線 ⊥ 過切點的半徑\n⑤ 圓外一點引兩切線，切線長相等\n⑥ 圓內接四邊形對角互補（相加 180°）\n\n扇形：弧長 = 2πr×(θ/360°)，面積 = πr²×(θ/360°)。`,
      en:`<b>Circle properties</b>\n\n① Angle at centre = 2 × angle at circumference\n② Angle in semicircle = 90°\n③ Angles in same segment equal\n④ Tangent ⊥ radius\n⑤ Tangents from an external point are equal\n⑥ Cyclic quadrilateral: opposite angles supplementary`}},
  {k:['平均數','中位數','眾數','mean','median','mode','統計'],
   a:{zh:`<b>三個集中趨勢量度</b>\n\n• <b>平均數</b> = 總和 ÷ 個數（受極端值影響）\n• <b>中位數</b>：排序後中間的數（不受極端值影響）\n• <b>眾數</b>：出現最多次的數\n\n<b>何時用哪個？</b>\n有極端值（收入、房價）→ 中位數\n分類數據（鞋碼）→ 眾數\n一般情況 → 平均數\n\n加權平均 = Σ(值×權重) ÷ Σ權重。`,
      en:`<b>Mean, median, mode</b>\n\nMean = sum ÷ count (affected by extremes)\nMedian = middle value after sorting (robust)\nMode = most frequent\n\nWeighted mean = Σ(value × weight) ÷ Σweight.`}},
  {k:['函數','拋物線','頂點','對稱軸','二次函數'],
   a:{zh:`<b>二次函數 y = ax² + bx + c</b>\n\n• a > 0 開口向上（有極小值）；a < 0 開口向下（有極大值）\n• 對稱軸 x = −b/(2a)\n• 頂點坐標：橫坐標 −b/(2a)，縱坐標代入求得\n\n<b>頂點式</b> y = a(x − h)² + k → 頂點 (h, k)，對稱軸 x = h。\n\n與 x 軸交點：令 y = 0 解二次方程。`,
      en:`<b>Quadratic function y = ax² + bx + c</b>\n\na > 0 opens up (min); a < 0 opens down (max).\nAxis: x = −b/(2a).\nVertex form: y = a(x−h)²+k → vertex (h,k).`}},
  {k:['相似','similar','面積比','邊長比'],
   a:{zh:`<b>相似三角形</b>\n\n判定：AAA（或 AA）、SSS（三邊成比例）、SAS（兩邊成比例且夾角相等）。\n\n• 對應邊成比例\n• <b>面積比 = (邊長比)²</b>\n• <b>體積比 = (邊長比)³</b>\n\n例：邊長比 2:3 → 面積比 4:9 → 體積比 8:27。\n\n⚠️ 最常見錯誤：把面積比當成邊長比。`,
      en:`<b>Similar triangles</b>\n\nTests: AAA/AA, SSS, SAS.\n\nArea ratio = (side ratio)²; Volume ratio = (side ratio)³.\n\n⚠️ Do not confuse area ratio with side ratio.`}}
];

function aiAnswer(text){
  const s = text.toLowerCase();
  // 特殊指令
  if(/總結|复盘|複盤|分析錯題|錯題總結|review/.test(text)){
    return summarizeWrong();
  }
  if(/錯題本|錯題|wrong book/.test(text)){
    const d = DB.data(state.user);
    if(!d.wrong.length) return '你的錯題本目前是空的，太棒了！繼續保持 📚';
    return `你的錯題本共有 <b>${d.wrong.length}</b> 題。\n\n${d.wrong.slice(0,5).map((w,i)=>`${i+1}. ${w.topicName || w.topic}`).join('\n')}\n\n🎯 到「我的 → 錯題本」可以逐題查看詳細解析。`;
  }
  if(/你好|hi|hello|哈囉/.test(s)){
    return '你好！我是你的數學 AI 助教 ✨\n\n你可以問我：\n• 一元二次方程怎麼解？\n• 因式分解有什麼方法？\n• 概率怎麼算？\n\n也可以直接說「總結我的錯題」幫你分析學習狀況。';
  }
  for(const item of AI_KB){
    if(item.k.some(k=>s.includes(k.toLowerCase()))){
      return item.a[state.lang] || item.a.zh;
    }
  }
  return `我暫時未能完全理解這個問題 ⭐\n\n試試這樣問：\n• 「一元二次方程怎麼解」\n• 「因式分解的方法」\n• 「畢氏定理」\n• 「概率怎麼算」\n• 「總結我的錯題」\n\n🎲 小提示：目前是<b>本地知識庫模式</b>，可在程式碼中接入真實 AI API 來回答任何問題。`;
}

function summarizeWrong(){
  const d = DB.data(state.user);
  if(!d.wrong.length) return '📌 <b>學習總結</b>\n\n你的錯題本是空的——目前沒有需要複習的錯題。\n\n建議：去「專題練習」挑戰更高難度，持續鞏固！';
  const byTopic = {};
  d.wrong.forEach(w=>{
    const k = w.topicName || w.topic || '其他';
    byTopic[k] = (byTopic[k]||0) + 1;
  });
  const sorted = Object.entries(byTopic).sort((a,b)=>b[1]-a[1]);
  let out = `📌 <b>錯題總結報告</b>\n\n共 <b>${d.wrong.length}</b> 道錯題，分佈如下：\n\n`;
  sorted.forEach(([k,v])=>{
    const bar = '█'.repeat(Math.min(v,12));
    out += `${k}：${bar} ${v} 題\n`;
  });
  const top = sorted[0];
  out += `\n📐 <b>重點複習建議</b>\n最需要加強的是「<b>${top[0]}</b>」（${top[1]} 題）。\n\n`;
  out += `💡 <b>複習步驟</b>\n1. 到「學習」頁重讀該課題的詳細講解\n2. 到「專題練習」選擇該課題，用「基礎 → 進階 → 挑戰」遞進訓練\n3. 每題做完查看解析，理解錯誤原因\n4. 3 天後再做一次同類題目鞏固`;
  return out;
}

function startExam(){
  const E = state.exam;
  const bank = BANK[E.topic];
  if(!bank){ alert('此課題暫無題目，請選擇其他課題。'); return; }

  const qs = [];
  for(let i=0;i<E.count;i++){
    let lv;
    if(E.level===0){
      // 混合：偏向中難
      const r = Math.random();
      lv = r<0.3 ? 1 : (r<0.75 ? 2 : 3);
    } else lv = E.level;
    const pool = bank[lv] || bank[1];
    const gen = P(pool);
    const q = gen();
    q.level = lv;
    qs.push(q);
  }

  const tp = TOPICS[E.grade].find(x=>x.id===E.topic);
  state.exam = {
    stage:'run', grade:E.grade, topic:E.topic, topicName:tp.title[state.lang],
    count:E.count, level:E.level, qs, idx:0, answers:Array(E.count).fill(null),
    startTime: Date.now()
  };
  renderExam();
}

function renderExamRun(){
  const E = state.exam;
  const q = E.qs[E.idx];
  const answered = E.answers[E.idx] !== null;

  $('#examRun').innerHTML = `
    <div class="panel">
      <div class="qbar">
        <span>${t('question',{n:E.idx+1,t:E.count})}</span>
        <span>${GRADE_META[E.grade].name[state.lang]} · ${E.topicName} · ${t('lv'+q.level)}</span>
      </div>
      <div class="progress"><i style="width:${(E.idx/E.count)*100}%"></i></div>
      <div class="qtext">${q.q[state.lang]}</div>
      <div class="ansrow">
        <input type="text" id="examInput" inputmode="decimal" autocomplete="off"
          placeholder="${t('inputPh')}" value="${answered?esc(E.answers[E.idx].raw):''}" ${answered?'disabled':''}>
        <button class="btn primary" id="examSubmit" ${answered?'disabled':''}>${t('submit')}</button>
      </div>
      <div class="feedback ${answered?(E.answers[E.idx].ok?'ok':'bad'):''}" id="examFb">
        ${answered ? (E.answers[E.idx].ok ? t('correct') : t('wrong') + NUM(q.ans)) : ''}
      </div>
      <div class="explain ${answered?'show':''}" id="examExplain">
        <h5>🎲 ${t('detailTitle')}</h5>
        ${answered ? q.ex[state.lang] : ''}
      </div>
      <button class="btn ghost" id="examNext" style="width:100%;margin-top:16px;${answered?'':'display:none'}">
        ${E.idx+1 < E.count ? t('next') : t('finish')}
      </button>
    </div>`;

  if(!answered){
    setTimeout(()=>{ const i=$('#examInput'); if(i) i.focus(); },80);
  }

  $('#examSubmit').onclick = submitExamAnswer;
  $('#examInput').onkeydown = e=>{ if(e.key==='Enter') submitExamAnswer(); };
  $('#examNext').onclick = ()=>{
    if(E.idx+1 < E.count){ E.idx++; renderExamRun(); }
    else finishExam();
  };
}

function submitExamAnswer(){
  const E = state.exam;
  const q = E.qs[E.idx];
  const input = $('#examInput');
  if(!input) return;
  const raw = input.value.trim().replace(/[−–—]/g,'-').replace(/[,，]/g,'');
  if(raw==='') return;

  let ok = false;
  const tol = q.tol==null?0.01:q.tol;
  if(tol===null || typeof q.ans==='string'){
    // 字串答案（如比例）
    const norm = s=>s.replace(/\s/g,'').replace(/：/g,':').toLowerCase();
    ok = norm(raw) === norm(String(q.ans));
  } else {
    const v = Number(raw);
    if(!isNaN(v)) ok = Math.abs(v - q.ans) < Math.max(tol, 1e-9);
  }

  E.answers[E.idx] = {raw, ok, ans:q.ans};
  renderExamRun();
}

function finishExam(){
  const E = state.exam;
  const correct = E.answers.filter(a=>a && a.ok).length;
  const secs = Math.round((Date.now()-E.startTime)/1000);

  E.stage = 'result';
  E.correct = correct;
  E.secs = secs;
  E.finishedAt = new Date().toISOString();

  // 保存到用户数据
  if(state.user){
    const d = DB.data(state.user);
    const rec = {
      id: 'h'+Date.now(),
      date: E.finishedAt,
      grade: E.grade, topic: E.topic, topicName: E.topicName,
      level: E.level, total: E.count, correct, secs,
      details: E.qs.map((q,i)=>{
        const a = E.answers[i];
        return {
          q: q.q, ans: q.ans, ex: q.ex, level: q.level,
          userRaw: a ? a.raw : null, ok: a ? a.ok : false
        };
      })
    };
    d.history.unshift(rec);
    if(d.history.length > 100) d.history = d.history.slice(0,100);

    // 錯題本
    E.qs.forEach((q,i)=>{
      const a = E.answers[i];
      if(!a || !a.ok){
        d.wrong.unshift({
          id: 'w'+Date.now()+'_'+i,
          date: E.finishedAt,
          topic: E.topic, topicName: E.topicName,
          grade: E.grade,
          q: q.q, ans: q.ans, ex: q.ex, level: q.level,
          userRaw: a ? a.raw : null
        });
      }
    });
    if(d.wrong.length > 300) d.wrong = d.wrong.slice(0,300);
    DB.save(state.user, d);
  }

  renderExam();
}
