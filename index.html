/* ---------- 坐標系（GeoGebra 簡化版） ---------- */
const G = {
  canvas:null, ctx:null, dpr:1,
  scale:44, ox:0, oy:0,
  mode:'point',
  points:[], segs:[], circles:[], pending:null,
  drag:null,
  inited:false,
  W:0, H:0
};

function initGraph(){
  const cv = $('#graphCanvas');
  if(!cv) return;
  G.canvas = cv;
  if(!G.inited){
    setupCanvas();
    G.inited = true;
    window.addEventListener('resize', ()=>{ if(state.view==='graph') setupCanvas(); });
  }
  renderGraphTools();
  drawGraph();
  renderGList();
}

function setupCanvas(){
  const cv = G.canvas;
  const box = cv.parentElement;
  const dpr = window.devicePixelRatio || 1;
  const w = box.clientWidth;
  const h = parseInt(getComputedStyle(cv).height) || 520;
  cv.width = w * dpr;
  cv.height = h * dpr;
  cv.style.width = w+'px';
  cv.style.height = h+'px';
  G.dpr = dpr;
  G.W = w; G.H = h;
  G.ctx = cv.getContext('2d');
  G.ctx.setTransform(dpr,0,0,dpr,0,0);
  bindGraphEvents();
}

function toPx(x,y){
  return [ G.W/2 + (x - G.ox)*G.scale, G.H/2 - (y - G.oy)*G.scale ];
}
function toMath(px,py){
  return [ (px - G.W/2)/G.scale + G.ox, (G.H/2 - py)/G.scale + G.oy ];
}

function drawGraph(){
  const ctx = G.ctx, W = G.W, H = G.H, s = G.scale;
  if(!ctx) return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,W,H);

  // 網格步長
  let step = 1;
  if(s < 22) step = 2;
  if(s < 12) step = 5;
  if(s > 85) step = 0.5;

  const [x0,y0] = toMath(0,0);
  const [x1,y1] = toMath(W,H);

  // 小網格
  ctx.strokeStyle = '#eef2f9';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const startX = Math.ceil(x0/step)*step;
  for(let x = startX; x <= x1; x += step){
    const [px] = toPx(x,0);
    ctx.moveTo(px,0); ctx.lineTo(px,H);
  }
  const startY = Math.ceil(y1/step)*step;
  for(let y = startY; y <= y0; y += step){
    const [,py] = toPx(0,y);
    ctx.moveTo(0,py); ctx.lineTo(W,py);
  }
  ctx.stroke();

  // 坐標軸
  const [zx, zy] = toPx(0,0);
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, zy); ctx.lineTo(W, zy);
  ctx.moveTo(zx, 0); ctx.lineTo(zx, H);
  ctx.stroke();

  // 箭頭
  ctx.fillStyle = '#94a3b8';
  ctx.beginPath(); ctx.moveTo(W-2,zy); ctx.lineTo(W-11,zy-5); ctx.lineTo(W-11,zy+5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(zx,2); ctx.lineTo(zx-5,11); ctx.lineTo(zx+5,11); ctx.fill();

  // 刻度數字
  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px -apple-system, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  const sx = Math.ceil(x0/step)*step;
  for(let x = sx; x <= x1; x += step){
    if(Math.abs(x) < 1e-9) continue;
    const [px] = toPx(x,0);
    ctx.beginPath();
    ctx.moveTo(px, zy-3); ctx.lineTo(px, zy+3);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillText(NUM(x), px, zy+6);
  }
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const sy = Math.ceil(y1/step)*step;
  for(let y = sy; y <= y0; y += step){
    if(Math.abs(y) < 1e-9) continue;
    const [,py] = toPx(0,y);
    ctx.beginPath();
    ctx.moveTo(zx-3, py); ctx.lineTo(zx+3, py);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillText(NUM(y), zx-7, py);
  }
  // 原點
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillText('O', zx-5, zy+4);

  // 線段
  ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2.4;
  G.segs.forEach(sg=>{
    const [ax,ay] = toPx(sg.a[0],sg.a[1]);
    const [bx,by] = toPx(sg.b[0],sg.b[1]);
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  });

  // 圓
  G.circles.forEach(c=>{
    const [cx,cy] = toPx(c.c[0],c.c[1]);
    ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(cx,cy,c.r*G.scale,0,Math.PI*2); ctx.stroke();
  });

  // 點
  G.points.forEach((p,i)=>{
    const [px,py] = toPx(p[0],p[1]);
    ctx.beginPath(); ctx.arc(px,py,5.5,0,Math.PI*2);
    ctx.fillStyle = '#f97316'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 11.5px -apple-system, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(`(${NUM(R2(p[0]))}, ${NUM(R2(p[1]))})`, px+9, py-4);
  });

  // 待定點提示
  if(G.pending){
    const [px,py] = toPx(G.pending[0],G.pending[1]);
    ctx.beginPath(); ctx.arc(px,py,6,0,Math.PI*2);
    ctx.fillStyle = 'rgba(14,165,233,.5)'; ctx.fill();
    ctx.setLineDash([4,4]);
    ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px,py,10,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }
}

function renderGraphTools(){
  const modes = [
    {id:'point',  label:t('addPoint')},
    {id:'segment',label:t('addSeg')},
    {id:'circle', label:t('addCircle')},
    {id:'erase',  label:t('erase')},
    {id:'pan',    label:t('pan')}
  ];
  $('#gtools').innerHTML =
    modes.map(m=>`<button data-m="${m.id}" class="${G.mode===m.id?'active':''}">${m.label}</button>`).join('') +
    `<button data-act="zin">＋</button><button data-act="zout">−</button>
     <button data-act="reset">${t('reset')}</button><button data-act="clear">${t('clear')}</button>`;

  $$('#gtools button').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.m){ G.mode = b.dataset.m; G.pending = null; renderGraphTools(); drawGraph(); }
      if(b.dataset.act==='zin'){ G.scale = Math.min(200, G.scale*1.25); drawGraph(); }
      if(b.dataset.act==='zout'){ G.scale = Math.max(8, G.scale/1.25); drawGraph(); }
      if(b.dataset.act==='reset'){ G.scale=44; G.ox=0; G.oy=0; drawGraph(); }
      if(b.dataset.act==='clear'){ G.points=[]; G.segs=[]; G.circles=[]; G.pending=null; drawGraph(); renderGList(); }
    };
  });
}

function renderGList(){
  const items = [];
  G.points.forEach((p,i)=>items.push({t:`點 (${NUM(R2(p[0]))}, ${NUM(R2(p[1]))})`, i, type:'p'}));
  G.segs.forEach((s,i)=>items.push({t:`線段 (${NUM(R2(s.a[0]))},${NUM(R2(s.a[1]))})→(${NUM(R2(s.b[0]))},${NUM(R2(s.b[1]))})`, i, type:'s'}));
  G.circles.forEach((c,i)=>items.push({t:`圓 心(${NUM(R2(c.c[0]))},${NUM(R2(c.c[1]))}) r=${NUM(R2(c.r))}`, i, type:'c'}));

  const el = $('#glist');
  if(!items.length){ el.innerHTML = `<li style="justify-content:center;color:#94a3b8;background:transparent">${t('none')}</li>`; return; }
  el.innerHTML = items.map(it=>
    `<li><span>${it.t}</span><button data-del="${it.type}${it.i}">🗑</button></li>`).join('');
  el.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.del;
      const type = k[0], i = +k.slice(1);
      if(type==='p'){ G.points.splice(i,1); G.segs = G.segs.filter(s=>Math.abs(s.a[0])<1e9); }
      if(type==='s') G.segs.splice(i,1);
      if(type==='c') G.circles.splice(i,1);
      drawGraph(); renderGList();
    };
  });
}

function bindGraphEvents(){
  const cv = G.canvas;
  if(cv._bound) return;
  cv._bound = true;

  let downPt = null, moved = false;

  cv.addEventListener('pointerdown', e=>{
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    downPt = {px, py, ox:G.ox, oy:G.oy};
    moved = false;
    cv.setPointerCapture(e.pointerId);
  });

  cv.addEventListener('pointermove', e=>{
    if(!downPt) return;
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const dx = px - downPt.px, dy = py - downPt.py;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
    if(G.mode==='pan' || e.pointerType==='touch' && e.isPrimary===false){
      G.ox = downPt.ox - dx/G.scale;
      G.oy = downPt.oy + dy/G.scale;
      drawGraph();
    }
  });

  cv.addEventListener('pointerup', e=>{
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    if(downPt && !moved) handleGraphClick(px, py);
    downPt = null;
  });

  cv.addEventListener('pointercancel', ()=>{ downPt = null; });

  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const [mx,my] = toMath(px,py);
    const k = e.deltaY > 0 ? 0.88 : 1.14;
    G.scale = Math.max(8, Math.min(200, G.scale*k));
    const [nx,ny] = toMath(px,py);
    G.ox += mx - nx; G.oy += my - ny;
    drawGraph();
  }, {passive:false});
}

function handleGraphClick(px, py){
  const [x, y] = toMath(px,py);
  const rx = Math.round(x*100)/100, ry = Math.round(y*100)/100;

  if(G.mode==='point'){
    G.points.push([rx, ry]);
    drawGraph(); renderGList();
  }
  else if(G.mode==='segment'){
    if(!G.pending){ G.pending = [rx,ry]; drawGraph(); }
    else {
      G.segs.push({a:G.pending, b:[rx,ry]});
      G.points.push(G.pending, [rx,ry]);
      G.pending = null;
      drawGraph(); renderGList();
    }
  }
  else if(G.mode==='circle'){
    if(!G.pending){ G.pending = [rx,ry]; drawGraph(); }
    else {
      const dx = rx-G.pending[0], dy = ry-G.pending[1];
      const r = Math.sqrt(dx*dx+dy*dy);
      if(r > 0.05){
        G.circles.push({c:G.pending, r});
        G.points.push(G.pending);
      }
      G.pending = null;
      drawGraph(); renderGList();
    }
  }
  else if(G.mode==='erase'){
    // 找最近的點
    let best = -1, bd = 1e9;
    G.points.forEach((p,i)=>{
      const [ppx,ppy] = toPx(p[0],p[1]);
      const d = Math.hypot(ppx-px, ppy-py);
      if(d < bd){ bd = d; best = i; }
    });
    if(bd < 20 && best>=0){ G.points.splice(best,1); drawGraph(); renderGList(); return; }
    // 找線段
    for(let i=G.segs.length-1;i>=0;i--){
      const s = G.segs[i];
      const [ax,ay]=toPx(s.a[0],s.a[1]), [bx,by]=toPx(s.b[0],s.b[1]);
      const d = distToSeg(px,py,ax,ay,bx,by);
      if(d < 10){ G.segs.splice(i,1); drawGraph(); renderGList(); return; }
    }
    // 找圓
    for(let i=G.circles.length-1;i>=0;i--){
      const c = G.circles[i];
      const [cx,cy] = toPx(c.c[0],c.c[1]);
      const rr = c.r*G.scale;
      if(Math.abs(Math.hypot(px-cx,py-cy) - rr) < 10){ G.circles.splice(i,1); drawGraph(); renderGList(); return; }
    }
  }
}

function distToSeg(px,py,x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const l2 = dx*dx+dy*dy;
  if(l2===0) return Math.hypot(px-x1,py-y1);
  let t = ((px-x1)*dx+(py-y1)*dy)/l2;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}

      <button class="btn ghost sm" id="logoutBtn">${t('logout')}</button>
    </div>
    <div class="tabs">${tabs.map(x=>`<button data-t="${x.id}" class="${state.userTab===x.id?'active':''}">${x.label}</button>`).join('')}</div>
    <div id="userBody">${body}</div>`;

  $('#logoutBtn').onclick = ()=>{ DB.setCur(null); state.user=null; render(); };
  $$('.tabs button').forEach(b=>{
    b.onclick = ()=>{ state.userTab = b.dataset.t; renderUser(); };
  });
  bindUserBody();
}

function renderHistory(d){
  if(!d.history.length) return `<div class="empty"><div class="ic">📈</div>${t('noHistory')}</div>`;
  return d.history.map((h,i)=>{
    const pct = Math.round(h.correct/h.total*100);
    const cls = pct>=80?'ok':(pct>=60?'mid':'bad');
    return `<div class="item">
      <div class="item-head">
        <div><b>${h.topicName || h.topic}</b>
          <span class="badge ${cls}">${h.correct}/${h.total} · ${pct}%</span>
          <span class="meta" style="margin-left:8px">${GRADE_META[h.grade] ? GRADE_META[h.grade].name[state.lang] : ''} · ${t('lv'+(h.level||1))}</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          <span class="meta">${new Date(h.date).toLocaleString()}</span>
          <button class="btn ghost sm" data-exp="${i}">${t('review')}</button>
        </div>
      </div>
      <div class="detail" id="hd${i}">
        ${h.details.map((x,j)=>{
          const ok = x.ok;
          return `<div style="padding:10px 0;border-bottom:1px dashed #eef2f9">
            <div class="dq">${j+1}. ${x.q[state.lang]}</div>
            <div class="dmeta">
              ${t('yourAns')}：${x.userRaw!=null && x.userRaw!=='' ? esc(x.userRaw) : t('noAns')}
              　|　${t('rightAns')}：<b>${NUM(x.ans)}</b>
              <span class="badge ${ok?'ok':'bad'}">${ok?'✅':'❌'}</span>
            </div>
            <div class="dex">${x.ex[state.lang]}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderWrong(d){
  if(!d.wrong.length) return `<div class="empty"><div class="ic">🎉</div>${t('noWrong')}</div>`;
  return d.wrong.map((w,i)=>`
    <div class="item">
      <div class="item-head">
        <div><b>${w.topicName || w.topic}</b>
          <span class="badge bad">${t('lv'+(w.level||1))}</span>
          <span class="meta" style="margin-left:8px">${new Date(w.date).toLocaleDateString()}</span>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn ghost sm" data-expw="${i}">${t('review')}</button>
          <button class="btn danger sm" data-delw="${i}">🗑</button>
        </div>
      </div>
      <div class="detail" id="wd${i}">
        <div class="dq">${w.q[state.lang]}</div>
        <div class="dmeta">
          ${t('yourAns')}：${w.userRaw!=null && w.userRaw!=='' ? esc(w.userRaw) : t('noAns')}
          　|　${t('rightAns')}：<b>${NUM(w.ans)}</b>
        </div>
        <div class="dex">${w.ex[state.lang]}</div>
        <button class="btn primary sm" data-master="${i}" style="margin-top:10px">${t('mastered')}</button>
      </div>
    </div>`).join('');
}

function renderNotes(d){
  return `
    <button class="btn primary" id="addNote" style="margin-bottom:14px">＋ ${t('newNote')}</button>
    <div id="noteForm"></div>
    ${d.notes.length ? d.notes.map((n,i)=>`
      <div class="note-item">
        <h5>
          <span>${esc(n.title)} ${n.tag?`<span class="tag">${esc(n.tag)}</span>`:''}</span>
          <span style="display:flex;gap:6px">
            <button class="btn ghost sm" data-editn="${i}">✏</button>
            <button class="btn danger sm" data-deln="${i}">🗑</button>
          </span>
        </h5>
        <p>${esc(n.body)}</p>
        <div style="font-size:11px;color:#94a3b8;margin-top:6px">${new Date(n.date).toLocaleString()}</div>
      </div>`).join('') : `<div class="empty"><div class="ic">📊</div>${t('noNotes')}</div>`}`;
}

function bindUserBody(){
  const d = DB.data(state.user);

  $$('[data-exp]').forEach(b=>{
    b.onclick = ()=>{
      const el = $('#hd'+b.dataset.exp);
      el.classList.toggle('show');
    };
  });
  $$('[data-expw]').forEach(b=>{
    b.onclick = ()=>{ $('#wd'+b.dataset.expw).classList.toggle('show'); };
  });
  $$('[data-delw]').forEach(b=>{
    b.onclick = ()=>{
      d.wrong.splice(+b.dataset.delw,1);
      DB.save(state.user, d);
      renderUser();
    };
  });
  $$('[data-master]').forEach(b=>{
    b.onclick = ()=>{
      d.wrong.splice(+b.dataset.master,1);
      DB.save(state.user, d);
      renderUser();
    };
  });

  const addBtn = $('#addNote');
  if(addBtn) addBtn.onclick = ()=> showNoteForm(-1);

  $$('[data-editn]').forEach(b=>{
    b.onclick = ()=> showNoteForm(+b.dataset.editn);
  });
  $$('[data-deln]').forEach(b=>{
    b.onclick = ()=>{
      d.notes.splice(+b.dataset.deln,1);
      DB.save(state.user, d);
      renderUser();
    };
  });
}

function showNoteForm(idx){
  const d = DB.data(state.user);
  const n = idx>=0 ? d.notes[idx] : {title:'', tag:'', body:''};
  $('#noteForm').innerHTML = `
    <div class="panel" style="margin-bottom:14px">
      <div class="field"><label>${t('noteTitle')}</label><input id="ntTitle" value="${esc(n.title)}"></div>
      <div class="field"><label>${t('noteTag')}</label><input id="ntTag" value="${esc(n.tag||'')}"></div>
      <div class="field"><label>${t('noteBody')}</label><textarea id="ntBody">${esc(n.body)}</textarea></div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" id="ntSave" style="flex:1">${t('save')}</button>
        <button class="btn ghost" id="ntCancel" style="flex:1">${t('cancel')}</button>
      </div>
    </div>`;

  $('#ntCancel').onclick = ()=>{ $('#noteForm').innerHTML=''; };
  $('#ntSave').onclick = ()=>{
    const title = $('#ntTitle').value.trim() || '未命名筆記';
    const tag = $('#ntTag').value.trim();
    const body = $('#ntBody').value.trim();
    if(!body) return;
    if(idx>=0){ d.notes[idx] = {...d.notes[idx], title, tag, body, date:Date.now()}; }
    else { d.notes.unshift({id:'n'+Date.now(), title, tag, body, date:Date.now()}); }
    DB.save(state.user, d);
    renderUser();
  };
}

/* ============================================================
   8. 事件綁定 & 啟動
   ============================================================ */
$$('.lang-switch button').forEach(b=>{
  b.onclick = ()=>{ state.lang = b.dataset.lang; chatHistory.length=0; render(); };
});

render();

});
